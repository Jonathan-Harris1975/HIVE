commands_restrictions:
  queue:
    conditions:
      - or:
          - sender-permission >= write
          - sender = renovate[bot]

merge_protections_settings:
  reporting_method: check-runs
  post_comment: true
  auto_merge_conditions:
    - base = main
    - label = autonomy:admitted
    - -draft
    - -conflict
    - -label = do-not-merge
    - -label = needs-manual-review
    - -label = autonomy:human-hold
    - -label = autonomy:superseded
    - -label = autonomy:obsolete
    - "#review-threads-unresolved = 0"

merge_protections:
  - name: autonomous admission
    if:
      - base = main
      - label = autonomy:admitted
    success_conditions:
      - check-success = ci-gate
      - check-success = CodeQL security alert gate
      - check-success = Trivy, Gitleaks and actionlint
      - check-success = Item 6 / Dependency Review
      - check-success = Item 6 / Renovate config
      - -draft
      - -conflict
      - -label = do-not-merge
      - -label = needs-manual-review
      - -label = autonomy:human-hold
      - -label = autonomy:superseded
      - -label = autonomy:obsolete
      - "#review-threads-unresolved = 0"

queue_rules:
  - name: routine
    merge_method: squash
    queue_conditions:
      - base = main
      - label = autonomy:admitted
      - check-success = ci-gate
      - check-success = CodeQL security alert gate
      - check-success = Trivy, Gitleaks and actionlint
      - check-success = Item 6 / Dependency Review
      - check-success = Item 6 / Renovate config
      - -label = autonomy:human-hold
      - -label = autonomy:obsolete
      - -label = autonomy:superseded
    merge_conditions:
      - check-success = ci-gate
      - check-success = CodeQL security alert gate
      - check-success = Trivy, Gitleaks and actionlint
      - check-success = Item 6 / Dependency Review
      - check-success = Item 6 / Renovate config

pull_request_rules:
  - name: close explicitly superseded autonomous pull requests
    conditions:
      - label = autonomy:superseded
      - -merged
      - -closed
    actions:
      comment:
        message: "Closing because a newer authoritative repair supersedes this autonomous PR."
      close:

  - name: close explicitly obsolete autonomous pull requests
    conditions:
      - label = autonomy:obsolete
      - -merged
      - -closed
    actions:
      comment:
        message: "Closing because revalidation shows this autonomous repair is no longer required."
      close:

  - name: refresh admitted Kilo implementation branches
    conditions:
      - base = main
      - -closed
      - -draft
      - -from-fork
      - label = autonomy:repair
      - label = autonomy:kilo-implementation
      - -conflict
      - -label = autonomy:human-hold
      - -label = autonomy:superseded
      - -label = autonomy:obsolete
      - -head ~= ^autonomy/repair-
      - "#commits-behind > 0"
    actions:
      update:
merge_queue:
  status_comments: outcomes
  queue_controls_comment: false
  skip_intermediate_results: false
  reset_on_external_merge: never
