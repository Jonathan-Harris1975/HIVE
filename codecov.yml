# Codecov is advisory: repository-native coverage floors remain authoritative.
codecov:
  require_ci_to_pass: true

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: auto
        threshold: 1%
        informational: true

comment:
  layout: "condensed_header, diff, flags, files, condensed_footer"
  behavior: default
  require_changes: true
  require_base: false
  require_head: true

github_checks:
  annotations: true
