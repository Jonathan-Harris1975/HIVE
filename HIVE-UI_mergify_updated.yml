commands_restrictions:
  queue:
    conditions:
      - or:
          - sender-permission >= write
          - sender = renovate[bot]

queue_rules:
  - name: routine
    merge_method: squash
    queue_conditions:
      - base = main
      - label = autonomy:admitted
      - check-success = ci-gate
      - check-success = CodeQL security alert gate
      - check-success = Trivy, Gitleaks and actionlint
      - -label = autonomy:human-hold
      - -label = autonomy:obsolete
      - -label = autonomy:superseded
    merge_conditions:
      - check-success = ci-gate
      - check-success = CodeQL security alert gate
      - check-success = Trivy, Gitleaks and actionlint

pull_request_rules:
  - name: close explicitly superseded autonomous pull requests
    conditions:
      - label = autonomy:superseded
      - -merged
      - -closed
    actions:
      comment:
        message: "Closing because a newer authoritative repair supersedes this autonomous PR."
      close:

  - name: close explicitly obsolete autonomous pull requests
    conditions:
      - label = autonomy:obsolete
      - -merged
      - -closed
    actions:
      comment:
        message: "Closing because revalidation shows this autonomous repair is no longer required."
      close:

  - name: refresh admitted Kilo implementation branches
    conditions:
      - base = main
      - -closed
      - -draft
      - -from-fork
      - label = autonomy:repair
      - label = autonomy:kilo-implementation
      - -conflict
      - -label = autonomy:human-hold
      - -label = autonomy:superseded
      - -label = autonomy:obsolete
      - -head ~= ^autonomy/repair-
      - "#commits-behind > 0"
    actions:
      update:

  - name: merge verified routine automation
    conditions:
      - base = main
      - -closed
      - -draft
      - -conflict
      - label = autonomy:admitted
      - check-success = ci-gate
      - -label = do-not-merge
      - -label = needs-manual-review
      - -label = autonomy:human-hold
      - -label = autonomy:superseded
      - -label = autonomy:obsolete
      - "#review-threads-unresolved = 0"
    actions:
      queue:
        name: routine
