version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      fastapi-family:
        patterns:
          - "fastapi"
          - "starlette"
        update-types:
          - "patch"
          - "minor"
      aws-sdk-family:
        patterns:
          - "boto3"
          - "botocore"
          - "s3transfer"
        update-types:
          - "patch"
          - "minor"
      pytest-family:
        patterns:
          - "pytest"
          - "pytest-*"
          - "coverage"
        update-types:
          - "patch"
          - "minor"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "deps(docker)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "deps(ci)"
