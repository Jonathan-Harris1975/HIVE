name: Security and repository quality

on:
  pull_request:
  # Default-branch evidence is produced by the weekend orchestrator (dispatch) just before
  # the Council run, not on every push to main.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hive-security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SCORECARD_VERSION: '5.5.0'

jobs:
  repository_security:
    name: Trivy, Gitleaks and actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify autonomy lifecycle regressions
        run: |
          python3 .github/scripts/test_autonomy_lifecycle.py
          python3 .github/scripts/test_weekend_orchestrator.py
      - name: Install pinned CI tools
        run: python scripts/install_ci_tools.py trivy gitleaks actionlint
      - name: Trivy filesystem vulnerability and misconfiguration scan
        run: >-
          .ci-tools/bin/trivy fs .
          --scanners vuln,misconfig
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --exit-code 1
          --no-progress
      - name: Gitleaks secret scan (PR range on pull requests, full history weekly)
        id: gitleaks
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          args=(git . --redact --no-banner --report-format json --report-path gitleaks-report.json --exit-code 1)
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            args+=(--log-opts="${BASE_SHA}..${HEAD_SHA}")
          fi
          .ci-tools/bin/gitleaks "${args[@]}"
      - name: Upload redacted Gitleaks diagnostic report
        if: always() && hashFiles('gitleaks-report.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-redacted-diagnostic-${{ github.run_id }}
          path: gitleaks-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce Gitleaks result
        if: steps.gitleaks.outcome == 'failure'
        run: |
          echo 'Gitleaks detected potential secrets. Download the redacted diagnostic artifact for rule, file, commit, line and fingerprint metadata.' >&2
          exit 1
      - name: Validate GitHub Actions workflows
        run: .ci-tools/bin/actionlint -color

  container_and_shell_quality:
    name: Hadolint and ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Docker and shell linters
        run: python scripts/install_ci_tools.py hadolint shellcheck
      - name: Lint Dockerfile
        run: .ci-tools/bin/hadolint Dockerfile
      - name: Lint operational shell scripts
        run: .ci-tools/bin/shellcheck scripts/production_smoke.sh scripts/start.sh scripts/smoke.sh

  link_integrity:
    name: Lychee link integrity
    # Links change on the internet, not with a pull request: weekly evidence run only.
    if: github.event_name != 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Lychee
        continue-on-error: true
        run: python scripts/install_ci_tools.py lychee
      - name: Check repository links
        continue-on-error: true
        run: >-
          .ci-tools/bin/lychee
          --no-progress
          --cache
          --max-retries 2
          --timeout 20
          README.md SECURITY.md CONTEXT_RESILIENCE.md docs

  scorecard:
    name: OpenSSF Scorecard
    continue-on-error: true
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Install pinned Scorecard CLI from source
        continue-on-error: true
        env:
          GOBIN: ${{ runner.temp }}/scorecard-bin
        run: |
          set -euo pipefail
          mkdir -p "$GOBIN"
          go install "github.com/ossf/scorecard/v5@v${SCORECARD_VERSION}"
          "$GOBIN/scorecard" version
      - name: Run OpenSSF Scorecard
        continue-on-error: true
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCORECARD_BIN: ${{ runner.temp }}/scorecard-bin/scorecard
        run: |
          set -euo pipefail
          "$SCORECARD_BIN" --repo="github.com/${GITHUB_REPOSITORY}" --format=json --show-details > scorecard.json
          cat scorecard.json
