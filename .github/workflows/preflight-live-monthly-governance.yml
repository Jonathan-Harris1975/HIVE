name: Preflight live monthly governance (read only)
on:
  workflow_dispatch:
    inputs:
      period:
        description: "Reporting month YYYY-MM (previously completed month)"
        required: true
        type: string
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment: production
    env:
      HIVE_BASE_URL: ${{ vars.HIVE_BASE_URL }}
      HIVE_ADMIN_TOKEN: ${{ secrets.HIVE_ADMIN_TOKEN }}
      PERIOD: ${{ inputs.period }}
    steps:
      - name: Validate configuration and inspect production (GET only)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          base = os.environ.get("HIVE_BASE_URL", "").strip().rstrip("/")
          token = os.environ.get("HIVE_ADMIN_TOKEN", "")
          period = os.environ.get("PERIOD", "").strip()
          if not re.fullmatch(r"20[0-9]{2}-(0[1-9]|1[0-2])", period):
              sys.exit("period must be YYYY-MM")
          if not base.startswith("https://") or not token:
              sys.exit("HIVE_BASE_URL (https) and HIVE_ADMIN_TOKEN are required")
          current_month = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m")
          if period >= current_month:
              sys.exit("period must be a completed month")

          def get(path, authenticated=False):
              headers = {"Accept": "application/json"}
              if authenticated:
                  headers["Authorization"] = "Bearer " + token
              request = urllib.request.Request(base + path, headers=headers, method="GET")
              try:
                  with urllib.request.urlopen(request, timeout=25) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return 404, None
                  print("GET failed:", path, "HTTP", error.code)
                  raise SystemExit(1)
              except (urllib.error.URLError, TimeoutError, ValueError):
                  print("GET failed:", path)
                  raise SystemExit(1)

          status, health = get("/health")
          if status != 200 or not isinstance(health, dict) or health.get("ok") is not True:
              sys.exit("HIVE health is not OK")
          required = ("openrouter_configured", "d1_configured", "r2_configured")
          missing = [key for key in required if health.get(key) is not True]
          print("HIVE health OK; build:", health.get("build"))
          print("Required configured flags:", {key: health.get(key) for key in required})
          if missing:
              sys.exit("Missing production configuration: " + ", ".join(missing))

          status, job = get("/v1/monthly-review/jobs/" + period, authenticated=True)
          if status == 404:
              print("No worker job claim found for", period)
              print("WARNING: 404 does not exclude legacy HTTP execution or downstream writes")
          elif status == 200 and isinstance(job, dict):
              print("Job response:", json.dumps(job, sort_keys=True))
              print("Existing job state must be reconciled before any execution")
          else:
              sys.exit("Unexpected job status response")
          print("Read-only preflight complete. No governance POST performed.")
          PY
