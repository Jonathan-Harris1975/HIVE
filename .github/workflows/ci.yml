name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11.16", "3.12.14", "3.13.15", "3.14.7"]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check "pip==26.2.1"
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip check
      - name: Run tests with coverage
        env:
          PYTHONPATH: backend
          APP_ENV: test
        run: |
          python -V
          python -m compileall -q backend/app backend/tests
          python -m pytest backend/tests -q --tb=short --cov=app --cov-report=term-missing --cov-fail-under=74

  performance:
    name: API performance regression gate (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14.7"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check "pip==26.2.1"
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip check
      - name: Enforce API latency SLOs
        env:
          PYTHONPATH: backend
          HIVE_PERF_REPORT_PATH: hive-performance.json
        run: python scripts/performance_gate.py
      - name: Retain performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hive-performance-${{ github.sha }}
          path: hive-performance.json
          if-no-files-found: error
          retention-days: 90

  lint:
    name: Lint, type and security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11.16"
          cache: "pip"
      - name: Reject committed literal secrets
        run: python scripts/secret_scan.py
      - name: Install tooling
        run: |
          python -m pip install --disable-pip-version-check "pip==26.2.1"
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Verify production dependency lock
        run: python scripts/verify_dependency_lock.py --compile
      - name: Ruff
        env:
          PYTHONPATH: backend
        run: python -m ruff check backend/app backend/tests scripts --select E4,E7,E9,F
      - name: Mypy
        env:
          PYTHONPATH: backend
        run: python scripts/mypy_guard.py
      - name: Bandit
        run: python -m bandit -q -r backend/app -ll
      - name: Dependency audit
        run: python -m pip_audit -r requirements.txt

  docker:
    name: Docker runtime and API smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Build Docker image
        run: docker build --target runtime -t hive:ci .
      - name: Verify runtime engineering binaries
        run: |
          docker run --rm hive:ci python --version
          docker run --rm hive:ci node --version
          docker run --rm hive:ci npm --version
          docker run --rm hive:ci node -e "process.exit(Number(process.versions.node.split('.')[0]) >= 20 ? 0 : 1)"
      - name: Boot API and probe HIVE health
        run: |
          docker run -d --name hive-ci-api -p 8000:8080 \
            -e APP_ENV='test' \
            -e ADMIN_BEARER_TOKEN='ci-local-hive-key' \
            -e DATABASE_ENABLED='false' \
            -e D1_ENABLED='false' \
            -e VECTORIZE_ENABLED='false' \
            -e EMBEDDINGS_ENABLED='false' \
            -e AI_SEARCH_ENABLED='false' \
            -e ALLOWED_HOSTS='127.0.0.1,localhost' \
            hive:ci
          trap 'docker logs hive-ci-api || true; docker rm -f hive-ci-api || true' EXIT
          started=false
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/livez >/tmp/livez.json; then
              started=true
              break
            fi
            sleep 1
          done
          test "$started" = "true"
          curl -fsS http://127.0.0.1:8000/health | tee /tmp/health.json
          curl -fsS -H 'Authorization: Bearer ci-local-hive-key' http://127.0.0.1:8000/v1/system/runtime-stats | tee /tmp/runtime.json
          python - <<'PY2'
          import json
          from pathlib import Path
          health = json.loads(Path('/tmp/health.json').read_text())
          runtime = json.loads(Path('/tmp/runtime.json').read_text())
          assert health['ok'] is True
          assert health['app'] == 'HIVE'
          assert runtime['ok'] is True
          assert 'repository_manager' in runtime
          assert 'model_registry' in runtime
          assert 'providers' in runtime
          PY2
      - name: Scan built production image for fixable high-severity vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hive:ci
          format: table
          output: trivy-hive-image.txt
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Print production image vulnerability report
        if: always()
        run: |
          if [ -f trivy-hive-image.txt ]; then
            cat trivy-hive-image.txt
          fi
      - name: Retain production image vulnerability report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hive-image-vulnerability-report-${{ github.sha }}
          path: trivy-hive-image.txt
          if-no-files-found: error
          retention-days: 90

  notify_failure:
    name: Notify central operations on CI failure
    needs: [test, performance, lint, docker]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Send redacted HIVE operational event
        env:
          OPS_ALERT_WEBHOOK_URL: ${{ vars.OPS_ALERT_WEBHOOK_URL || secrets.OPS_ALERT_WEBHOOK_URL || 'https://hive.jonathan-harris.online/v1/ops/events' }}
          OPS_ALERT_WEBHOOK_TOKEN: ${{ secrets.OPS_ALERT_WEBHOOK_TOKEN || secrets.OPS_EVENT_INGEST_TOKEN }}
        run: >-
          python scripts/ops_notify.py
          --service HIVE
          --event-type ci_failed
          --title "HIVE GitHub Actions failed"
          --summary "The HIVE CI workflow failed. Open the linked run for the failing job and logs."
          --event-id "github:${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}"
          --release-id "${{ github.sha }}"
          --url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  release_gate:
    name: Release gate (exact SHA)
    needs: [test, performance, lint, docker]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require all release checks to be green
        env:
          RESULT_TEST: ${{ needs.test.result }}
          RESULT_PERFORMANCE: ${{ needs.performance.result }}
          RESULT_LINT: ${{ needs.lint.result }}
          RESULT_DOCKER: ${{ needs.docker.result }}
        run: |
          test "$RESULT_TEST" = "success"
          test "$RESULT_PERFORMANCE" = "success"
          test "$RESULT_LINT" = "success"
          test "$RESULT_DOCKER" = "success"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert checked-out commit is the workflow SHA
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '{"repository":"%s","sha":"%s","workflow_run":"%s","status":"green"}\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" > release-attestation.json
      - name: Retain exact-SHA release attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-attestation-${{ github.sha }}
          path: release-attestation.json
          retention-days: 90
