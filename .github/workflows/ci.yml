name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  # The weekend orchestrator dispatches CI on the settled default-branch SHA; there is
  # deliberately no cron here so CI never starts in the middle of the Renovate window.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Include the immutable source SHA so evidence for a newer PR commit cannot evict a
  # pending run for an older SHA from GitHub's one-pending-run concurrency slot.
  group: hive-ci-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect runtime-affecting changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.diff.outputs.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Decide whether runtime gates are needed
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Pushes to main, dispatches and the weekend run always execute every gate.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # On pull_request the checkout is the merge commit: HEAD^1 is the base tip.
          changed="$(git diff --name-only HEAD^1 HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(backend/|scripts/|Dockerfile|\.dockerignore|requirements|runtime\.txt|nixpacks\.toml|Procfile|\.github/workflows/ci\.yml|\.github/scripts/)'; then
            echo "runtime=true" >> "$GITHUB_OUTPUT"
          else
            echo "runtime=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    permissions:
      contents: read
      id-token: write
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Pull requests (and Mergify queue candidates) test the production Python only;
        # the full compatibility matrix runs in the weekend evidence run.
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.14.7"]' || '["3.11.16","3.12.14","3.13.15","3.14.7"]') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check "pip==26.2.1"
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip check
      - name: Run tests with coverage
        env:
          PYTHONPATH: backend
          APP_ENV: test
        run: |
          python -V
          python -m compileall -q backend/app backend/tests
          python -m pytest backend/tests -q --tb=short --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=74

      - name: Upload coverage to Codecov
        # Free-tier budget: upload once per week, in the run that precedes the Council.
        if: github.event_name == 'workflow_dispatch' && matrix.python-version == '3.14.7'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage.xml
          flags: unit
          fail_ci_if_error: false

  performance:
    name: API performance regression gate (Python 3.14)
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check "pip==26.2.1"
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip check
      - name: Enforce API latency SLOs
        env:
          PYTHONPATH: backend
          HIVE_PERF_REPORT_PATH: hive-performance.json
        run: python scripts/performance_gate.py
      - name: Retain performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hive-performance-${{ github.sha }}
          path: hive-performance.json
          if-no-files-found: error
          retention-days: 90

  lint:
    name: Lint, type and security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
          cache: "pip"
      - name: Reject committed literal secrets
        run: python scripts/secret_scan.py
      - name: Install tooling
        run: |
          python -m pip install --disable-pip-version-check "pip==26.2.1"
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Verify production dependency lock
        run: python scripts/verify_dependency_lock.py --compile
      - name: Ruff
        env:
          PYTHONPATH: backend
        run: python -m ruff check backend/app backend/tests scripts --select E4,E7,E9,F
      - name: Mypy
        env:
          PYTHONPATH: backend
        run: python scripts/mypy_guard.py
      - name: Bandit
        run: python -m bandit -q -r backend/app -ll
      - name: Dependency audit
        run: python -m pip_audit -r requirements.txt

  docker:
    name: Docker runtime and API smoke
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Docker image
        run: docker build --target runtime -t hive:ci .
      - name: Verify runtime engineering binaries
        run: |
          docker run --rm hive:ci python --version
          docker run --rm hive:ci node --version
          docker run --rm hive:ci npm --version
          docker run --rm hive:ci node -e "process.exit(Number(process.versions.node.split('.')[0]) >= 20 ? 0 : 1)"
      - name: Boot API and probe HIVE health
        run: |
          docker run -d --name hive-ci-api -p 8000:8080 \
            -e APP_ENV='test' \
            -e ADMIN_BEARER_TOKEN='ci-local-hive-key' \
            -e DATABASE_ENABLED='false' \
            -e D1_ENABLED='false' \
            -e VECTORIZE_ENABLED='false' \
            -e EMBEDDINGS_ENABLED='false' \
            -e AI_SEARCH_ENABLED='false' \
            -e ALLOWED_HOSTS='127.0.0.1,localhost' \
            hive:ci
          trap 'docker logs hive-ci-api || true; docker rm -f hive-ci-api || true' EXIT
          started=false
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/livez >/tmp/livez.json; then
              started=true
              break
            fi
            sleep 1
          done
          test "$started" = "true"
          curl -fsS http://127.0.0.1:8000/health | tee /tmp/health.json
          curl -fsS -H 'Authorization: Bearer ci-local-hive-key' http://127.0.0.1:8000/v1/system/runtime-stats | tee /tmp/runtime.json
          python - <<'PY2'
          import json
          from pathlib import Path
          health = json.loads(Path('/tmp/health.json').read_text())
          runtime = json.loads(Path('/tmp/runtime.json').read_text())
          assert health['ok'] is True
          assert health['app'] == 'HIVE'
          assert runtime['ok'] is True
          assert 'repository_manager' not in runtime
          assert 'model_registry' in runtime
          assert 'providers' in runtime
          PY2
      - name: Install pinned Trivy CLI
        run: python scripts/install_ci_tools.py trivy
      - name: Scan built production image for fixable high-severity vulnerabilities
        run: >-
          .ci-tools/bin/trivy image hive:ci
          --format table
          --output trivy-hive-image.txt
          --exit-code 1
          --ignore-unfixed
          --pkg-types os,library
          --severity CRITICAL,HIGH
          --no-progress
      - name: Print production image vulnerability report
        if: always()
        run: |
          if [ -f trivy-hive-image.txt ]; then
            cat trivy-hive-image.txt
          fi
      - name: Retain production image vulnerability report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hive-image-vulnerability-report-${{ github.sha }}
          path: trivy-hive-image.txt
          if-no-files-found: warn
          retention-days: 90

  notify_failure:
    name: Notify central operations on CI failure
    needs: [test, performance, lint, docker]
    # Superseded pull-request runs are cancelled by design and must not raise operational events.
    if: ${{ always() && github.event_name != 'pull_request' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Send redacted HIVE operational event
        env:
          OPS_ALERT_WEBHOOK_URL: ${{ vars.OPS_ALERT_WEBHOOK_URL || secrets.OPS_ALERT_WEBHOOK_URL || 'https://hive.jonathan-harris.online/v1/ops/events' }}
          OPS_ALERT_WEBHOOK_TOKEN: ${{ secrets.OPS_ALERT_WEBHOOK_TOKEN || secrets.OPS_EVENT_INGEST_TOKEN }}
        run: >-
          python scripts/ops_notify.py
          --service HIVE
          --event-type ci_failed
          --title "HIVE GitHub Actions failed"
          --summary "The HIVE CI workflow failed. Open the linked run for the failing job and logs."
          --event-id "github:${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}"
          --release-id "${{ github.sha }}"
          --url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  release_gate:
    name: Release gate (exact SHA)
    needs: [changes, test, performance, lint, docker]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require all release checks to be green
        env:
          RESULT_CHANGES: ${{ needs.changes.result }}
          RUNTIME_CHANGED: ${{ needs.changes.outputs.runtime }}
          RESULT_TEST: ${{ needs.test.result }}
          RESULT_PERFORMANCE: ${{ needs.performance.result }}
          RESULT_LINT: ${{ needs.lint.result }}
          RESULT_DOCKER: ${{ needs.docker.result }}
        run: |
          set -euo pipefail
          test "$RESULT_CHANGES" = "success"
          test "$RESULT_LINT" = "success"
          for result in "$RESULT_TEST" "$RESULT_PERFORMANCE" "$RESULT_DOCKER"; do
            if [ "$RUNTIME_CHANGED" = "true" ]; then
              test "$result" = "success"
            else
              # Runtime gates are skipped only when the change cannot affect the runtime.
              test "$result" = "skipped"
            fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert checked-out commit is the workflow SHA
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '{"repository":"%s","sha":"%s","workflow_run":"%s","status":"green"}\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" > release-attestation.json
      - name: Retain exact-SHA release attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-attestation-${{ github.sha }}
          path: release-attestation.json
          retention-days: 90

  ci_gate:
    name: ci-gate
    needs: [release_gate, autonomous_repair_guard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Enforce aggregate CI result
        env:
          RELEASE_GATE_RESULT: ${{ needs.release_gate.result }}
          REPAIR_GUARD_RESULT: ${{ needs.autonomous_repair_guard.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$RELEASE_GATE_RESULT" = "success" || { echo "release_gate was $RELEASE_GATE_RESULT" >&2; exit 1; }
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test "$REPAIR_GUARD_RESULT" = "success"
          fi


  autonomous_repair_guard:
    name: Autonomous repair marker gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Require autonomous repair request to be resolved
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags origin "$base_sha" "$head_sha"
          merge_base="$(git merge-base "$base_sha" "$head_sha")"
          changed_markers="$(git diff --name-only --diff-filter=AMR "$merge_base" "$head_sha" -- '.autonomy/repair-request-*.md')"
          if [ -n "$changed_markers" ]; then
            echo "::error::This PR introduces an unresolved autonomous repair request. Fix the underlying failure, then remove the repair-request marker."
            printf '%s\n' "$changed_markers"
            exit 1
          fi
