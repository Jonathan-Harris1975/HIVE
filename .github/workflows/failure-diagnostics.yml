name: Deployment failure diagnostics

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] read-only diagnostics using trusted default-branch code
    workflows: ['*']
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Workflow run ID to inspect'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  failure_details:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.name != 'Deployment failure diagnostics' &&
       contains(fromJSON('["failure","cancelled","timed_out","action_required"]'), github.event.workflow_run.conclusion))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted reporting code only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Summarise failed jobs and their evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
        run: python3 .github/scripts/failure_diagnostics.py
      - name: Preserve deployment failure details
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-failure-details-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment-failure-details.md
          retention-days: 30
          if-no-files-found: error
