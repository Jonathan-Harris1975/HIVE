name: Autonomous main-branch repair PR

on:
  workflow_run:
    workflows: ["CI", "Koyeb production deployment watch", "CodeQL", "Security and repository quality"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: autonomous-repair-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  create_repair_pr:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.head_branch == github.event.repository.default_branch ||
        (
          github.event.workflow_run.conclusion == 'failure' &&
          (github.event.workflow_run.name == 'CodeQL' || github.event.workflow_run.name == 'Security and repository quality') &&
          github.event.workflow_run.pull_requests[0].number != null
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Mint autonomous repair GitHub App token
        id: app_token
        env:
          APP_ID: ${{ vars.AUTONOMY_REPAIR_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.AUTONOMY_REPAIR_APP_PRIVATE_KEY }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${APP_ID:-}" || { echo "::error::Repository variable AUTONOMY_REPAIR_APP_ID is required."; exit 1; }
          test -n "${APP_PRIVATE_KEY:-}" || { echo "::error::Repository secret AUTONOMY_REPAIR_APP_PRIVATE_KEY is required."; exit 1; }

          key_file="${RUNNER_TEMP}/autonomy-repair-app.pem"
          printf '%s\n' "$APP_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"

          b64url() {
            openssl base64 -A | tr '+/' '-_' | tr -d '='
          }

          now="$(date +%s)"
          iat="$((now - 60))"
          exp="$((now + 540))"
          header="$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)"
          payload="$(printf '{"iat":%s,"exp":%s,"iss":"%s"}' "$iat" "$exp" "$APP_ID" | b64url)"
          unsigned="${header}.${payload}"
          signature="$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$key_file" -binary | b64url)"
          jwt="${unsigned}.${signature}"

          installation_id="$(
            curl --fail-with-body --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${jwt}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/installation" |
              jq -er '.id'
          )"

          app_token="$(
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${jwt}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/app/installations/${installation_id}/access_tokens" |
              jq -er '.token'
          )"

          rm -f "$key_file"
          echo "::add-mask::${app_token}"
          printf 'token=%s\n' "$app_token" >> "$GITHUB_OUTPUT"

      - name: Create or continue one repair PR and invoke Kilo in PR context
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "GitHub App authentication succeeded; manual dispatch creates no repair PR."
            exit 0
          fi

          gh label create autonomy:repair --repo "$REPO" --color "0E8A16" --description "Autonomous repair PR awaiting a validated fix" --force
          gh label create autonomy:security-repair --repo "$REPO" --color "D93F0B" --description "Security finding routed through autonomous repair" --force
          gh label create autonomy:superseded --repo "$REPO" --color "B60205" --description "Superseded by a newer authoritative repair" --force
          gh label create autonomy:obsolete --repo "$REPO" --color "D4C5F9" --description "Repair is no longer required" --force
          gh label create autonomy:human-hold --repo "$REPO" --color "FBCA04" --description "Automation must stop for human action" --force

          security_workflow=false
          if [ "$RUN_NAME" = "CodeQL" ] || [ "$RUN_NAME" = "Security and repository quality" ]; then
            security_workflow=true
          fi

          # A security check can fail again on an existing autonomous repair PR.
          # Hand that failure back to Kilo on the same PR rather than opening a
          # nested PR/fork, which also avoids the untrusted-fork approval path.
          if [ "$HEAD_BRANCH" != "$DEFAULT_BRANCH" ]; then
            if [ "$RUN_CONCLUSION" != "failure" ] || [ "$security_workflow" != "true" ] || [ -z "${SOURCE_PR:-}" ]; then
              exit 0
            fi
            pr_meta="$(gh pr view "$SOURCE_PR" --repo "$REPO" --json author,labels)"
            labels="$(printf '%s' "$pr_meta" | jq -r '[.labels[].name] | join(",")')"
            pr_author="$(printf '%s' "$pr_meta" | jq -r '.author.login // ""')"
            trusted_repair=false
            case ",$labels," in
              *,autonomy:repair,*) trusted_repair=true ;;
            esac
            case "$pr_author" in
              kilo-code-bot|kilo-code-bot\[bot\]) trusted_repair=true ;;
            esac
            if [ "$trusted_repair" != "true" ]; then
              echo "PR #$SOURCE_PR is neither an autonomous repair carrier nor a Kilo implementation PR; no Kilo handoff."
              exit 0
            fi
            marker="<!-- autonomy-security-handoff:${RUN_ID} -->"
            already="$(gh api --paginate "repos/${REPO}/issues/${SOURCE_PR}/comments" --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -1)"
            if [ -n "$already" ]; then
              echo "Security handoff for run $RUN_ID already posted to PR #$SOURCE_PR."
              exit 0
            fi
            gh pr edit "$SOURCE_PR" --repo "$REPO" --add-label autonomy:security-repair
          handoff_body="$(cat <<EOF
          ${marker}
          @kilocode-bot the security workflow failed on PR #${SOURCE_PR}: ${RUN_URL}

          Continue the smallest safe remediation from this PR context. If your GitHub implementation mode can update this PR branch, do that. Otherwise create exactly one replacement implementation PR against ${DEFAULT_BRANCH}, link it back to PR #${SOURCE_PR}, and avoid repeated PR chains. Do not dismiss CodeQL alerts, weaken queries/tests, add broad suppressions or alter secret allowlists. If no safe repository code change is appropriate, explain why and leave any autonomous repair carrier marker in place for autonomy:human-hold.
          EOF
          )"
          gh pr comment "$SOURCE_PR" --repo "$REPO" --body "$handoff_body"
            exit 0
          fi

          if [ "$RUN_CONCLUSION" = "success" ]; then
            while read -r old_pr; do
              [ -n "$old_pr" ] || continue
              labels="$(gh pr view "$old_pr" --repo "$REPO" --json labels --jq '[.labels[].name] | join(",")')"
              case ",$labels," in
                *,autonomy:human-hold,*|*,autonomy:superseded,*|*,autonomy:obsolete,*) continue ;;
              esac
              body="$(gh pr view "$old_pr" --repo "$REPO" --json body --jq '.body')"
              if [[ "$body" == *"Failed workflow: **${RUN_NAME}**"* ]]; then
                gh pr edit "$old_pr" --repo "$REPO" --add-label autonomy:obsolete
              fi
            done < <(gh pr list --repo "$REPO" --state open --label autonomy:repair --json number --jq '.[].number')
            exit 0
          fi

          if [ "$RUN_CONCLUSION" != "failure" ]; then
            echo "Workflow conclusion is $RUN_CONCLUSION; no repair action required."
            exit 0
          fi

          existing="$(gh pr list --repo "$REPO" --state open --label autonomy:repair --search "$HEAD_SHA in:body" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Repair PR #$existing already tracks failed SHA $HEAD_SHA."
            exit 0
          fi

          while read -r old_pr; do
            [ -n "$old_pr" ] || continue
            on_hold="$(gh pr view "$old_pr" --repo "$REPO" --json labels --jq '[.labels[].name] | any(. == "autonomy:human-hold")')"
            if [ "$on_hold" != "true" ]; then
              gh pr edit "$old_pr" --repo "$REPO" --add-label autonomy:superseded
            fi
          done < <(gh pr list --repo "$REPO" --state open --label autonomy:repair --json number --jq '.[].number')

          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          gh repo clone "$REPO" "$workdir/repo" -- --quiet
          cd "$workdir/repo"
          git checkout --quiet "$HEAD_SHA"

          branch="autonomy/repair-${RUN_ID}"
          git checkout -b "$branch"
          mkdir -p .autonomy/repair-requests
          request=".autonomy/repair-requests/${RUN_ID}.md"
          cat > "$request" <<EOF
          # Autonomous repair request

          - Failed workflow: ${RUN_NAME}
          - Failed commit: ${HEAD_SHA}
          - Failed run: ${RUN_URL}
          - Run ID: ${RUN_ID}
          - Security-classified workflow: ${security_workflow}

          Fix the smallest code, dependency-manifest, lockfile, build or deployment-configuration defect that caused this failure.
          Delete this file only after the underlying defect is fixed and the relevant repository checks pass.

          Guardrails:
          - Do not weaken tests, CodeQL, Trivy, Gitleaks, required checks, branch/ruleset protections, workflow permissions, secret handling or security policy.
          - Do not dismiss CodeQL alerts, reduce query coverage, add broad suppressions or change secret allowlists merely to make CI green.
          - Do not merge or deploy directly.
          - If credentials, destructive data changes, platform administration, alert dismissal or a security-policy decision are required, keep this marker and use autonomy:human-hold.
          EOF

          git config user.name "autonomy-repair[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$request"
          git commit --quiet -m "chore: open autonomous repair request for run $RUN_ID"
          git push --quiet origin "$branch"

          body="$(cat <<EOF
          Main-branch CI/deployment/security verification failed.

          Failed workflow: **${RUN_NAME}**
          Failed commit: \`${HEAD_SHA}\`
          Failed run: ${RUN_URL}

          This carrier PR is deliberately blocked by the **Autonomous repair marker gate**. If Kilo can safely update this branch, the marker is removed only after the defect is fixed. If Kilo opens a separate implementation PR, this marker remains as lifecycle evidence until a successful default-branch rerun marks the carrier obsolete.
          EOF
          )"

          labels="autonomy:repair"
          if [ "$security_workflow" = "true" ]; then
            labels="autonomy:repair,autonomy:security-repair"
          fi
          pr_url="$(gh pr create --repo "$REPO" --base "$DEFAULT_BRANCH" --head "$branch" \
            --title "[autonomy] Repair $RUN_NAME failure ($RUN_ID)" \
            --body "$body" --label "$labels")"
          echo "Created repair PR: $pr_url"

          if [ "$security_workflow" = "true" ]; then
            kilo_instruction="@kilocode-bot diagnose the linked CodeQL/security failure and implement the smallest safe fix. If your GitHub implementation mode can update this carrier branch, do so and remove the repair marker only after the security finding is genuinely cleared. Otherwise create exactly one implementation PR against $DEFAULT_BRANCH, link it back to this carrier, and leave the carrier marker untouched. Prefer a same-repository branch when supported. Do not dismiss alerts, weaken CodeQL queries/tests, add broad suppressions, change Gitleaks allowlists or expose secrets. If no safe repository code change is appropriate, explain why so the carrier can be placed on autonomy:human-hold."
          else
            kilo_instruction="@kilocode-bot diagnose the failed workflow linked in this carrier PR and implement the smallest safe fix. If your GitHub implementation mode can update this carrier branch, do so and remove the repair marker after the relevant checks genuinely pass. Otherwise create exactly one implementation PR against $DEFAULT_BRANCH, link it back to this carrier, and leave the carrier marker untouched. Prefer a same-repository branch when supported. Changes to package.json, lockfiles, dependency metadata, build configuration or minor code are allowed when required. Do not weaken security/test gates and do not merge or deploy directly."
          fi
          gh pr comment "$pr_url" --body "$kilo_instruction"
