name: Autonomous main-branch repair PR

on:
  workflow_run:
    workflows: ["CI", "Koyeb production deployment watch"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: autonomous-repair-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  create_repair_pr:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.head_branch == github.event.repository.default_branch &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - name: Mint autonomous repair GitHub App token
        id: app_token
        env:
          APP_ID: ${{ vars.AUTONOMY_REPAIR_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.AUTONOMY_REPAIR_APP_PRIVATE_KEY }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${APP_ID:-}" || { echo "::error::Repository variable AUTONOMY_REPAIR_APP_ID is required."; exit 1; }
          test -n "${APP_PRIVATE_KEY:-}" || { echo "::error::Repository secret AUTONOMY_REPAIR_APP_PRIVATE_KEY is required."; exit 1; }

          key_file="${RUNNER_TEMP}/autonomy-repair-app.pem"
          printf '%s\n' "$APP_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"

          b64url() {
            openssl base64 -A | tr '+/' '-_' | tr -d '='
          }

          now="$(date +%s)"
          iat="$((now - 60))"
          exp="$((now + 540))"
          header="$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)"
          payload="$(printf '{"iat":%s,"exp":%s,"iss":"%s"}' "$iat" "$exp" "$APP_ID" | b64url)"
          unsigned="${header}.${payload}"
          signature="$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$key_file" -binary | b64url)"
          jwt="${unsigned}.${signature}"

          installation_id="$(
            curl --fail-with-body --silent --show-error               --header "Accept: application/vnd.github+json"               --header "Authorization: Bearer ${jwt}"               --header "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/${REPO}/installation" |
              jq -er '.id'
          )"

          app_token="$(
            curl --fail-with-body --silent --show-error               --request POST               --header "Accept: application/vnd.github+json"               --header "Authorization: Bearer ${jwt}"               --header "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/app/installations/${installation_id}/access_tokens" |
              jq -er '.token'
          )"

          rm -f "$key_file"
          echo "::add-mask::${app_token}"
          printf 'token=%s\n' "$app_token" >> "$GITHUB_OUTPUT"

      - name: Create one repair PR and invoke Kilo in PR context
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "GitHub App authentication succeeded; manual dispatch creates no repair PR."
            exit 0
          fi

          gh label create autonomy:repair --repo "$REPO" --color "0E8A16" --description "Autonomous repair PR awaiting a validated fix" --force
          gh label create autonomy:superseded --repo "$REPO" --color "B60205" --description "Superseded by a newer authoritative repair" --force
          gh label create autonomy:obsolete --repo "$REPO" --color "D4C5F9" --description "Repair is no longer required" --force
          gh label create autonomy:human-hold --repo "$REPO" --color "FBCA04" --description "Automation must stop for human action" --force

          if [ "$RUN_CONCLUSION" = "success" ]; then
            while read -r old_pr; do
              [ -n "$old_pr" ] || continue
              labels="$(gh pr view "$old_pr" --repo "$REPO" --json labels --jq '[.labels[].name] | join(",")')"
              case ",$labels," in
                *,autonomy:human-hold,*|*,autonomy:superseded,*|*,autonomy:obsolete,*) continue ;;
              esac
              body="$(gh pr view "$old_pr" --repo "$REPO" --json body --jq '.body')"
              if [[ "$body" == *"Failed workflow: **${RUN_NAME}**"* ]]; then
                gh pr edit "$old_pr" --repo "$REPO" --add-label autonomy:obsolete
              fi
            done < <(gh pr list --repo "$REPO" --state open --label autonomy:repair --json number --jq '.[].number')
            exit 0
          fi

          if [ "$RUN_CONCLUSION" != "failure" ]; then
            echo "Workflow conclusion is $RUN_CONCLUSION; no repair action required."
            exit 0
          fi

          existing="$(gh pr list --repo "$REPO" --state open --label autonomy:repair --search "$HEAD_SHA in:body" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Repair PR #$existing already tracks failed SHA $HEAD_SHA."
            exit 0
          fi

          while read -r old_pr; do
            [ -n "$old_pr" ] || continue
            on_hold="$(gh pr view "$old_pr" --repo "$REPO" --json labels --jq '[.labels[].name] | any(. == "autonomy:human-hold")')"
            if [ "$on_hold" != "true" ]; then
              gh pr edit "$old_pr" --repo "$REPO" --add-label autonomy:superseded
            fi
          done < <(gh pr list --repo "$REPO" --state open --label autonomy:repair --json number --jq '.[].number')

          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          gh repo clone "$REPO" "$workdir/repo" -- --quiet
          cd "$workdir/repo"
          git checkout --quiet "$HEAD_SHA"

          branch="autonomy/repair-${RUN_ID}"
          git checkout -b "$branch"
          mkdir -p .autonomy/repair-requests
          request=".autonomy/repair-requests/${RUN_ID}.md"
          cat > "$request" <<EOF
          # Autonomous repair request

          - Failed workflow: ${RUN_NAME}
          - Failed commit: ${HEAD_SHA}
          - Failed run: ${RUN_URL}
          - Run ID: ${RUN_ID}

          Fix the smallest code, dependency-manifest, lockfile, build or deployment-configuration defect that caused this failure.
          Delete this file only after the underlying defect is fixed and the relevant repository checks pass.

          Guardrails:
          - Do not weaken tests, CodeQL, Trivy, Gitleaks, required checks, branch/ruleset protections, workflow permissions, secret handling or security policy.
          - Do not add broad suppressions or allowlists merely to make CI green.
          - Do not merge or deploy directly.
          - If credentials, destructive data changes, platform administration or a security-policy decision are required, keep this marker and apply autonomy:human-hold.
          EOF

          git config user.name "autonomy-repair[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$request"
          git commit --quiet -m "chore: open autonomous repair request for run $RUN_ID"
          git push --quiet origin "$branch"

          body="$(cat <<EOF
          Main-branch CI/deployment verification failed.

          Failed workflow: **${RUN_NAME}**
          Failed commit: \`${HEAD_SHA}\`
          Failed run: ${RUN_URL}

          This PR is deliberately blocked by the **Autonomous repair marker gate** until the underlying defect is fixed and .autonomy/repair-requests/${RUN_ID}.md is removed.
          EOF
          )"

          pr_url="$(gh pr create --repo "$REPO" --base "$DEFAULT_BRANCH" --head "$branch"             --title "[autonomy] Repair $RUN_NAME failure ($RUN_ID)"             --body "$body" --label autonomy:repair)"
          echo "Created repair PR: $pr_url"

          gh pr comment "$pr_url" --body "@kilocode-bot please diagnose the failed workflow linked in this PR and implement the smallest safe fix directly on this repair branch. Changes to package.json, lockfiles, dependency metadata, build configuration or minor code are allowed when required. Fix the root cause, run the relevant checks, then remove the repair-request marker. Do not weaken security/test gates and do not merge or deploy directly."
