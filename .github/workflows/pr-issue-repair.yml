name: Autonomous PR issue repair

on:
  workflow_run:
    workflows: ["CI", "Koyeb production deployment watch", "CodeQL", "Security and repository quality"]
    types: [completed]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read
  security-events: read

concurrency:
  group: kilo-pr-repair-${{ github.repository }}
  cancel-in-progress: false

jobs:
  route_verified_issue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted router from default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Extract actionable PR findings and start Kilo repair
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          KILO_REPAIR_TRIGGER_URL: ${{ secrets.KILO_REPAIR_TRIGGER_URL }}
          KILO_REPAIR_PR_LOGIN: ${{ vars.KILO_REPAIR_PR_LOGIN }}
        run: python3 .github/scripts/pr_repair_router.py
