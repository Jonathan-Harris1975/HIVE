name: Persist DAST report evidence to R2

on:
  workflow_run:
    workflows: ["DAST penetration test"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: r2-dast-evidence-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  persist:
    if: ${{ github.event.workflow_run.event != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - name: Check out trusted persistence helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Collect exact-run DAST evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_STATUS: ${{ github.event.workflow_run.conclusion }}
          SOURCE_URL: ${{ github.event.workflow_run.html_url }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "${#SOURCE_SHA}" -eq 40
          mkdir -p "$RUNNER_TEMP/r2-dast"
          gh run download "$SOURCE_RUN_ID" --repo "$REPO" --dir "$RUNNER_TEMP/downloaded" || true
          find "$RUNNER_TEMP/downloaded" -type f \( -iname 'report*.html' -o -iname 'report*.json' -o -iname 'report*.md' -o -iname '*zap*' \) -exec cp {} "$RUNNER_TEMP/r2-dast/" \; 2>/dev/null || true
          jq -n --arg repository "$REPO" --arg sha "$SOURCE_SHA" --arg run_id "$SOURCE_RUN_ID" --arg run_attempt "$SOURCE_RUN_ATTEMPT" --arg timestamp "$(date -u +%FT%TZ)" --arg status "$SOURCE_STATUS" --arg source_run "$SOURCE_URL"             '{repository:$repository,default_branch_sha:$sha,workflow_run_id:$run_id,workflow_run_attempt:$run_attempt,scan_timestamp:$timestamp,dast_status:$status,scanner:"OWASP ZAP",report_format:"native ZAP outputs when supplied by scanner artifact",source_run:$source_run}'             > "$RUNNER_TEMP/r2-dast/summary.json"
          jq -n --arg repository "$REPO" --arg sha "$SOURCE_SHA" --arg run_id "$SOURCE_RUN_ID" --arg run_attempt "$SOURCE_RUN_ATTEMPT" --arg source_run "$SOURCE_URL"             '{repository:$repository,default_branch_sha:$sha,workflow_run_id:$run_id,workflow_run_attempt:$run_attempt,source_run:$source_run}'             > "$RUNNER_TEMP/r2-dast/run-context.json"
      - name: Persist and verify DAST evidence
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          EVIDENCE_RUN_ID: ${{ github.event.workflow_run.id }}
          EVIDENCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          EVIDENCE_STATUS: ${{ github.event.workflow_run.conclusion }}
        run: python3 .github/scripts/persist_ci_report_r2.py dast "${{ github.event.workflow_run.head_sha }}" "$RUNNER_TEMP/r2-dast"
