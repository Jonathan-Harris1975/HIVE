name: Isolated negative control proof
on:
  pull_request:
    branches: [codex/20261004-ci-ownership-recovery]
    paths:
      - ci-fixtures/negative-controls/**
      - .github/workflows/isolated-negative-proof.yml
permissions:
  contents: read
jobs:
  prove_rejection:
    name: Prove isolated actionlint, zizmor and Renovate rejection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Install direct integrity-verified scanner tools
        run: python3 scripts/install_ci_tools.py actionlint zizmor
      - name: Verify each isolated defect is rejected for the expected reason
        run: python3 ci-fixtures/negative-controls/prove_negative_controls.py
      - name: Retain negative control evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: isolated-negative-control-evidence-${{ github.sha }}
          path: negative-control-evidence/
          if-no-files-found: error
          retention-days: 90
