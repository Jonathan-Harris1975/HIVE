name: Council merge window
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, labeled, unlabeled]
  workflow_run:
    workflows: [CI, Repository Council completion]
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: council-window-${{ github.repository }}-default
      cancel-in-progress: false
    steps:
      - name: Check out protected default-branch controller only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Reconcile exact-head Council merge permissions
        env:
          GH_TOKEN: ${{ github.token }}
          KILO_REPAIR_PR_LOGIN: ${{ vars.KILO_REPAIR_PR_LOGIN }}
          DAST_ENABLED: ${{ vars.DAST_ENABLED }}
        run: python3 .github/scripts/merge_window.py
