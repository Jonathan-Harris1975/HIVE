name: PR branch sync

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-branch-sync
  cancel-in-progress: false

jobs:
  sync-pr-branches:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Update eligible same-repository PR branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          api = "https://api.github.com/repos/" + urllib.parse.quote(repo, safe="/")
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + token,
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(path, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req_headers = dict(headers)
              if data is not None:
                  req_headers["Content-Type"] = "application/json"
              req = urllib.request.Request(api + path, data=data, headers=req_headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      body = response.read()
                      return response.status, json.loads(body) if body else None
              except urllib.error.HTTPError as error:
                  body = error.read()
                  try:
                      detail = json.loads(body) if body else {}
                  except json.JSONDecodeError:
                      detail = {}
                  return error.code, detail

          def paginated_pulls():
              page = 1
              while True:
                  status, pulls = request(
                      "/pulls?state=open&per_page=100&page=" + str(page)
                  )
                  if status != 200 or not isinstance(pulls, list):
                      raise RuntimeError("Could not list open PRs (HTTP " + str(status) + ")")
                  if not pulls:
                      return
                  yield from pulls
                  if len(pulls) < 100:
                      return
                  page += 1

          for item in paginated_pulls():
              number = item.get("number")
              head = item.get("head") or {}
              base = item.get("base") or {}
              head_repo = head.get("repo") or {}
              labels = {label.get("name") for label in item.get("labels", [])}
              if (
                  not isinstance(number, int)
                  or item.get("draft") is True
                  or base.get("ref") != "main"
                  or head_repo.get("full_name", "").casefold() != repo.casefold()
                  or head.get("sha") is None
                  or labels & {"autonomy:human-hold", "needs-human", "no-auto-update"}
              ):
                  continue

              sha = head["sha"]
              path = "/pulls/" + str(number) + "/update-branch"
              status, detail = request(path, method="PUT", payload={"expected_head_sha": sha})
              if status in (200, 202):
                  print("Updated PR #" + str(number) + " from main.")
                  continue

              # GitHub also uses 422 for non-conflict states; only a confirmed dirty
              # merge state is routed to repair. Permission, rate-limit, and API errors
              # never create a repair comment or label.
              if status not in (409, 422):
                  print("Branch update for PR #" + str(number) + " returned HTTP " + str(status) + "; no repair dispatch.")
                  continue
              current_status = None
              current = None
              for attempt in range(3):
                  current_status, current = request("/pulls/" + str(number))
                  if current_status != 200 or not isinstance(current, dict):
                      break
                  if current.get("head", {}).get("sha") != sha:
                      break
                  mergeable = current.get("mergeable")
                  mergeable_state = current.get("mergeable_state")
                  if mergeable is False or mergeable_state in ("dirty", "conflicting"):
                      break
                  if mergeable is not None and mergeable_state not in ("unknown", "unstable"):
                      break
                  if attempt < 2:
                      time.sleep(1 + attempt)

              if (
                  current_status != 200
                  or not isinstance(current, dict)
                  or current.get("head", {}).get("sha") != sha
                  or current.get("state") != "open"
                  or current.get("draft") is True
                  or current.get("base", {}).get("ref") != "main"
                  or (current.get("head", {}).get("repo") or {}).get("full_name", "").casefold() != repo.casefold()
                  or not (current.get("mergeable") is False or current.get("mergeable_state") in ("dirty", "conflicting"))
              ):
                  print("Could not confirm a merge conflict for PR #" + str(number) + "; no repair dispatch.")
                  continue

              marker = "<!-- pr-branch-sync-conflict:" + str(number) + ":" + sha + " -->"
              comments_status, comments = request(
                  "/issues/" + str(number) + "/comments?per_page=100"
              )
              if comments_status != 200 or not isinstance(comments, list):
                  print("Could not check existing repair notice for PR #" + str(number) + "; no duplicate comment posted.")
                  continue
              if any(marker in str(comment.get("body", "")) for comment in comments):
                  print("Existing repair notice found for PR #" + str(number) + ".")
                  continue

              body = (
                  marker
                  + "\n@kilocode-bot fix it\n"
                  + "GitHub confirmed this same-repository PR branch conflicts with the latest main. "
                  + "Please update this existing branch, preserve both sides' changes, and run its checks. "
                  + "Do not merge or deploy."
              )
              comment_status, _ = request(
                  "/issues/" + str(number) + "/comments",
                  method="POST",
                  payload={"body": body},
              )
              if comment_status not in (200, 201):
                  print("Could not post the deduplicated repair notice for PR #" + str(number) + " (HTTP " + str(comment_status) + ").")
                  continue
              print("Routed confirmed conflict on PR #" + str(number) + " to repair.")
          PY
