name: Koyeb production deployment watch

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: koyeb-deployment-watch-HIVE
  cancel-in-progress: true

jobs:
  watch:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned release commit
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Check Koyeb deployment-watch configuration
        id: deployment_config
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          KOYEB_SERVICE: ${{ secrets.KOYEB_SERVICE }}
        run: |
          if [ -n "${KOYEB_TOKEN:-}" ] && [ -n "${KOYEB_SERVICE:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::HIVE deployment watcher is not configured; deployment attestation and downstream smoke dispatch are skipped."
          fi
      - name: Install verified Koyeb CLI
        if: steps.deployment_config.outputs.configured == 'true'
        env:
          KOYEB_CLI_VERSION: "5.10.2"
        run: |
          set -euo pipefail
          archive="koyeb-cli_${KOYEB_CLI_VERSION}_linux_amd64.tar.gz"
          release_url="https://github.com/koyeb/koyeb-cli/releases/download/v${KOYEB_CLI_VERSION}"
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
            --output "$workdir/$archive" "$release_url/$archive"
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
            --output "$workdir/checksums.txt" "$release_url/checksums.txt"
          (
            cd "$workdir"
            grep -F "  $archive" checksums.txt > archive.sha256
            test -s archive.sha256
            sha256sum --check --strict archive.sha256
            tar -xzf "$archive"
          )
          install -d -m 0755 "$HOME/.local/bin"
          install -m 0755 "$workdir/koyeb" "$HOME/.local/bin/koyeb"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Watch production deployment
        if: steps.deployment_config.outputs.configured == 'true'
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          KOYEB_SERVICE: ${{ secrets.KOYEB_SERVICE }}
          SERVICE_DISPLAY_NAME: HIVE
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
          OPS_ALERT_WEBHOOK_TOKEN: ${{ secrets.OPS_ALERT_WEBHOOK_TOKEN }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          EXPECTED_DEPLOYMENT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          EXPECTED_DEPLOYMENT_AFTER: ${{ github.event.workflow_run.created_at || '' }}
        run: python scripts/watch_koyeb_deployment.py
      - name: Record exact-SHA production deployment attestation
        if: steps.deployment_config.outputs.configured == 'true'
        env:
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          printf '{"repository":"%s","sha":"%s","workflow_run":"%s","service":"HIVE","status":"production-deployment-green"}\n' \
            "$GITHUB_REPOSITORY" "$DEPLOYED_SHA" "$GITHUB_RUN_ID" > deployment-attestation.json
      - name: Retain production deployment evidence
        if: steps.deployment_config.outputs.configured == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hive-deployment-attestation-${{ github.event.workflow_run.head_sha || github.sha }}
          path: deployment-attestation.json
          if-no-files-found: error
          retention-days: 90
      - name: Trigger central ecosystem smoke
        if: steps.deployment_config.outputs.configured == 'true'
        env:
          ECOSYSTEM_SMOKE_DISPATCH_TOKEN: ${{ secrets.ECOSYSTEM_SMOKE_DISPATCH_TOKEN }}
          ECOSYSTEM_SMOKE_REPOSITORY: ${{ vars.ECOSYSTEM_SMOKE_REPOSITORY }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          test -n "${ECOSYSTEM_SMOKE_DISPATCH_TOKEN:-}" || { echo "ECOSYSTEM_SMOKE_DISPATCH_TOKEN is required" >&2; exit 1; }
          target="${ECOSYSTEM_SMOKE_REPOSITORY:-${GITHUB_REPOSITORY_OWNER}/MAST}"
          payload="$(jq -cn --arg ref main --arg repo "$GITHUB_REPOSITORY" --arg sha "$SOURCE_SHA" '{ref:$ref,inputs:{source_repository:$repo,source_sha:$sha}}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${ECOSYSTEM_SMOKE_DISPATCH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/${target}/actions/workflows/ecosystem-smoke.yml/dispatches"
