name: Koyeb production deployment watch

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] exact-main successful same-repository CI gate enforced below
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: koyeb-deployment-watch-HIVE
  # A weekend verification must not cancel a push-triggered deployment watch in flight.
  cancel-in-progress: false

jobs:
  watch:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    environment: Koyeb
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # pinned release commit
      - name: Check Koyeb deployment-watch configuration
        id: deployment_config
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          KOYEB_SERVICE: ${{ vars.KOYEB_SERVICE }}
        run: |
          set -euo pipefail
          missing=()
          for name in KOYEB_TOKEN KOYEB_SERVICE; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::HIVE production deployment verification cannot run. Missing required configuration: %s\n' "${missing[*]}"
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - name: Install verified Koyeb CLI
        env:
          KOYEB_CLI_VERSION: "5.10.2"
        run: |
          set -euo pipefail
          archive="koyeb-cli_${KOYEB_CLI_VERSION}_linux_amd64.tar.gz"
          release_url="https://github.com/koyeb/koyeb-cli/releases/download/v${KOYEB_CLI_VERSION}"
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
            --output "$workdir/$archive" "$release_url/$archive"
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
            --output "$workdir/checksums.txt" "$release_url/checksums.txt"
          (
            cd "$workdir"
            grep -F "  $archive" checksums.txt > archive.sha256
            test -s archive.sha256
            sha256sum --check --strict archive.sha256
            tar -xzf "$archive"
          )
          install -d -m 0755 "$HOME/.local/bin"
          install -m 0755 "$workdir/koyeb" "$HOME/.local/bin/koyeb"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Watch production deployment
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          KOYEB_SERVICE: ${{ vars.KOYEB_SERVICE }}
          SERVICE_DISPLAY_NAME: HIVE
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
          OPS_ALERT_WEBHOOK_TOKEN: ${{ secrets.OPS_ALERT_WEBHOOK_TOKEN }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          EXPECTED_DEPLOYMENT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Only a push run is expected to produce a new deployment. For a weekend dispatch
          # (or a manual run) the watcher verifies the live deployment of the exact SHA.
          EXPECTED_DEPLOYMENT_AFTER: ${{ (github.event.workflow_run.event == 'push' && github.event.workflow_run.created_at) || '' }}
        run: python scripts/watch_koyeb_deployment.py
      - name: Record exact-SHA production deployment attestation
        env:
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          printf '{"repository":"%s","sha":"%s","workflow_run":"%s","service":"HIVE","status":"production-deployment-green"}\n' \
            "$GITHUB_REPOSITORY" "$DEPLOYED_SHA" "$GITHUB_RUN_ID" > deployment-attestation.json
      - name: Retain production deployment evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hive-deployment-attestation-${{ github.event.workflow_run.head_sha || github.sha }}
          path: deployment-attestation.json
          if-no-files-found: error
          retention-days: 90
      - name: Trigger central ecosystem smoke
        env:
          ECOSYSTEM_SMOKE_DISPATCH_TOKEN: ${{ secrets.ECOSYSTEM_SMOKE_DISPATCH_TOKEN }}
          ECOSYSTEM_SMOKE_REPOSITORY: ${{ vars.ECOSYSTEM_SMOKE_REPOSITORY }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${ECOSYSTEM_SMOKE_DISPATCH_TOKEN:-}" ]; then
            echo "::notice::Optional MAST ecosystem smoke dispatch is not configured; production deployment evidence is retained."
            exit 0
          fi
          target="${ECOSYSTEM_SMOKE_REPOSITORY:-${GITHUB_REPOSITORY_OWNER}/MAST}"
          payload="$(jq -cn --arg ref main --arg repo "$GITHUB_REPOSITORY" --arg sha "$SOURCE_SHA" '{ref:$ref,inputs:{source_repository:$repo,source_sha:$sha}}')"
          if ! curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${ECOSYSTEM_SMOKE_DISPATCH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/${target}/actions/workflows/ecosystem-smoke.yml/dispatches"; then
            echo "::warning::Optional MAST ecosystem smoke dispatch failed; check the central MAST workflow independently."
          fi

