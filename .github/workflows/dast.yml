name: DAST penetration test

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Authorised target URL. Leave empty to use the configured environment or repository value."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: dast-${{ github.repository }}
  cancel-in-progress: false

jobs:
  scan:
    name: OWASP ZAP full active scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: Koyeb
      deployment: false
    outputs:
      enabled: ${{ steps.resolve.outputs.enabled }}
    steps:
      - name: Resolve DAST configuration from environment or repository
        id: resolve
        env:
          # Step-level context resolution runs after the selected Environment is loaded.
          DAST_ENABLED_SETTING: ${{ vars.DAST_ENABLED || 'false' }}
          DAST_TARGET_URL_VARIABLE: ${{ vars.DAST_TARGET_URL || '' }}
          DAST_TARGET_URL_SECRET: ${{ secrets.DAST_TARGET_URL || '' }}
          TARGET_URL_INPUT: ${{ inputs.target_url || '' }}
        shell: bash
        run: |
          set -euo pipefail
          enabled="${DAST_ENABLED_SETTING:-false}"
          if [[ "$enabled" != "true" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "DAST is disabled."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          target="${TARGET_URL_INPUT:-${DAST_TARGET_URL_SECRET:-${DAST_TARGET_URL_VARIABLE:-}}}"
          if [[ -z "$target" ]]; then
            echo "::error::DAST is enabled but no authorised target URL is configured."
            exit 1
          fi
          case "$target" in
            https://*|http://localhost*|http://127.0.0.1*) ;;
            *) echo "::error::Refusing active DAST against a non-HTTPS remote target."; exit 1;;
          esac
          printf '::add-mask::%s\n' "$target"
          printf 'target=%s\n' "$target" >> "$GITHUB_OUTPUT"

      - name: Check out trusted evidence helper
        if: ${{ steps.resolve.outputs.enabled == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Run authorised ZAP full scan
        id: zap
        if: ${{ steps.resolve.outputs.enabled == 'true' }}
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        with:
          target: ${{ steps.resolve.outputs.target }}
          allow_issue_writing: false
          fail_action: true
          artifact_name: dast-zap-full-${{ github.run_id }}

      - name: Package exact-run DAST evidence
        if: ${{ always() && steps.resolve.outputs.enabled == 'true' }}
        env:
          ZAP_OUTCOME: ${{ steps.zap.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dast-r2"
          find "$GITHUB_WORKSPACE" -maxdepth 4 -type f \
            \( -name 'report_json.json' -o -name 'report_html.html' -o -name 'report_md.md' \
               -o -name 'report_*.json' -o -name 'report_*.html' -o -name 'report_*.md' \
               -o -name 'zap*.log' \) \
            -exec cp {} "$RUNNER_TEMP/dast-r2/" \;
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg outcome "${ZAP_OUTCOME:-not-run}" \
            '{repository:$repository,default_branch_sha:$sha,workflow_run_id:$run_id,workflow_run_attempt:$run_attempt,scanner:"OWASP ZAP",dast_status:$outcome}' \
            > "$RUNNER_TEMP/dast-r2/summary.json"

      - name: Upload exact-run evidence for R2 persistence
        if: ${{ always() && steps.resolve.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dast-r2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dast-r2/
          if-no-files-found: error
          retention-days: 7

  persist:
    name: Persist evidence with R2 environment credentials
    needs: [scan]
    if: ${{ always() && needs.scan.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: R2
      deployment: false
    env:
      # Environment variables are read directly at runtime; these aliases are
      # only repository-scope fallbacks. Environment secrets take precedence
      # over repository secrets through GitHub's secrets context.
      R2_ENDPOINT_REPOSITORY: ${{ vars.CF_R2_ENDPOINT_URL || vars.R2_ENDPOINT_URL || vars.R2_ENDPOINT || '' }}
      R2_ENDPOINT_SECRET: ${{ secrets.R2_ENDPOINT || secrets.CF_R2_ENDPOINT_URL || secrets.R2_ENDPOINT_URL || '' }}
      R2_ACCOUNT_ID_REPOSITORY: ${{ vars.R2_ACCOUNT_ID || vars.CF_R2_ACCOUNT_ID || '' }}
      R2_ACCOUNT_ID_SECRET: ${{ secrets.R2_ACCOUNT_ID || secrets.CF_R2_ACCOUNT_ID || '' }}
      R2_ACCESS_KEY_ID_REPOSITORY: ${{ vars.R2_ACCESS_KEY_ID || vars.CF_R2_ACCESS_KEY_ID || '' }}
      R2_ACCESS_KEY_ID_SECRET: ${{ secrets.R2_ACCESS_KEY_ID || secrets.CF_R2_ACCESS_KEY_ID || '' }}
      R2_SECRET_ACCESS_KEY_SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.CF_R2_SECRET_ACCESS_KEY || '' }}
    steps:
      - name: Check out trusted evidence helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download exact-run DAST evidence
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v8.0.0
        with:
          name: dast-r2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dast-r2

      - name: Resolve R2 credentials from environment or repository
        env:
          # Step-level contexts include the selected R2 Environment and repository fallback.
          R2_ENDPOINT_REPOSITORY: ${{ vars.CF_R2_ENDPOINT_URL || vars.R2_ENDPOINT_URL || vars.R2_ENDPOINT || '' }}
          R2_ENDPOINT_SECRET: ${{ secrets.R2_ENDPOINT || secrets.CF_R2_ENDPOINT_URL || secrets.R2_ENDPOINT_URL || '' }}
          R2_ACCOUNT_ID_REPOSITORY: ${{ vars.R2_ACCOUNT_ID || vars.CF_R2_ACCOUNT_ID || '' }}
          R2_ACCOUNT_ID_SECRET: ${{ secrets.R2_ACCOUNT_ID || secrets.CF_R2_ACCOUNT_ID || '' }}
          R2_ACCESS_KEY_ID_REPOSITORY: ${{ vars.R2_ACCESS_KEY_ID || vars.CF_R2_ACCESS_KEY_ID || '' }}
          R2_ACCESS_KEY_ID_SECRET: ${{ secrets.R2_ACCESS_KEY_ID || secrets.CF_R2_ACCESS_KEY_ID || '' }}
          R2_SECRET_ACCESS_KEY_SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.CF_R2_SECRET_ACCESS_KEY || '' }}
        shell: bash
        run: |
          set -euo pipefail
          account_id="${R2_ACCOUNT_ID_SECRET:-${R2_ACCOUNT_ID_REPOSITORY:-}}"
          endpoint="${R2_ENDPOINT_SECRET:-${R2_ENDPOINT_REPOSITORY:-}}"
          access_key="${R2_ACCESS_KEY_ID_SECRET:-${R2_ACCESS_KEY_ID_REPOSITORY:-}}"
          secret_key="${R2_SECRET_ACCESS_KEY_SECRET:-}"
          if [[ -z "$endpoint" && -n "$account_id" ]]; then
            endpoint="https://${account_id}.r2.cloudflarestorage.com"
          fi
          [[ -n "$endpoint" ]] || { echo "::error::R2 endpoint or account ID is required at Environment or repository scope."; exit 1; }
          [[ -n "$access_key" ]] || { echo "::error::R2 access key ID is required at Environment or repository scope."; exit 1; }
          [[ -n "$secret_key" ]] || { echo "::error::R2 secret access key is required as a GitHub secret."; exit 1; }
          printf 'R2_ENDPOINT=%s\nR2_ACCESS_KEY_ID=%s\nR2_SECRET_ACCESS_KEY=%s\n' \
            "$endpoint" "$access_key" "$secret_key" >> "$GITHUB_ENV"

      - name: Persist and verify DAST evidence in hive-repositories
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: python3 .github/scripts/persist_ci_report_r2.py dast "$SOURCE_SHA" "$RUNNER_TEMP/dast-r2"
