name: Item 6 hardening

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
  merge_group:

concurrency:
  group: item6-hardening-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dependency-review:
    name: Item 6 / Dependency Review
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Seed unsafe Actions canary
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/__zizmor_seed_canary.yml <<'YAML'
          name: zizmor synthetic canary
          on:
            pull_request_target:
          permissions:
            contents: write
          jobs:
            unsafe:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                  with:
                    ref: ${{ github.event.pull_request.head.sha }}
          YAML

      - name: Prove zizmor detects seeded unsafe workflow
        id: zizmor_seed
        continue-on-error: true
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          annotations: false
          min-severity: medium
          min-confidence: medium
          online-audits: false
          version: "1.30.1"

      - name: Remove zizmor canary and assert detection
        if: always()
        env:
          ZIZMOR_SEED_OUTCOME: ${{ steps.zizmor_seed.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/__zizmor_seed_canary.yml
          if [ "$ZIZMOR_SEED_OUTCOME" != "failure" ]; then
            echo "::error::Seeded unsafe Actions pattern was not rejected by zizmor."
            exit 1
          fi

      - name: Audit GitHub Actions with zizmor
        # Blocking after the live trigger baseline was reconciled. Accepted
        # trigger exceptions are narrow and documented at the trigger itself.
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          annotations: true
          min-severity: medium
          min-confidence: medium
          online-audits: false
          version: "1.30.1"

  renovate-config:
    name: Item 6 / Renovate config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0

      - name: Prove malformed Renovate configuration fails
        shell: bash
        run: |
          set -euo pipefail
          malformed="$(mktemp)"
          printf '%s\n' '{"extends":["config:recommended"],"platformAutomerge":"not-a-boolean"}' > "$malformed"
          set +e
          npx --yes --package=renovate@44.133.0 renovate-config-validator --strict "$malformed"
          status=$?
          set -e
          rm -f "$malformed"
          if [ "$status" -eq 0 ]; then
            echo "::error::Malformed Renovate configuration unexpectedly passed strict validation."
            exit 1
          fi

      - name: Validate Renovate configuration
        run: npx --yes --package=renovate@44.133.0 renovate-config-validator --strict renovate.json

# Artifact provenance/SBOM is intentionally N/A in this workflow. HIVE is
# deployed by Koyeb's git-driven build and GitHub Actions does not publish the
# immutable production artifact or digest Koyeb deploys. Attesting a generated
# repository SBOM would not prove provenance for the running service.
