name: Item 6 hardening

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
  merge_group:

concurrency:
  group: item6-hardening-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dependency-review:
    name: Item 6 / Dependency Review
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit GitHub Actions with zizmor
        # Blocking after the live trigger baseline was reconciled. Accepted
        # trigger exceptions are narrow and documented at the trigger itself.
        uses: zizmorcore/zizmor-action@f9597c869b2e67095f9b527070297a13a6efe928 # v0.7.0
        with:
          advanced-security: false
          annotations: true
          min-severity: medium
          min-confidence: medium
          online-audits: false
          version: "1.30.1"

      - name: Create seeded unsafe Actions canary
        shell: bash
        run: |
          set -euo pipefail
          cat > .zizmor-seeded-canary.yml <<'YAML'
          name: synthetic-zizmor-canary
          on:
            pull_request_target:
          permissions:
            contents: write
          jobs:
            unsafe:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@main
          YAML

      - name: Prove zizmor detects the seeded unsafe pattern
        id: seeded_zizmor
        continue-on-error: true
        uses: zizmorcore/zizmor-action@f9597c869b2e67095f9b527070297a13a6efe928 # v0.7.0
        with:
          inputs: .zizmor-seeded-canary.yml
          advanced-security: false
          annotations: false
          min-severity: medium
          min-confidence: medium
          online-audits: false
          version: "1.30.1"

      - name: Require seeded zizmor detection and remove canary
        if: always()
        env:
          SEEDED_ZIZMOR_OUTCOME: ${{ steps.seeded_zizmor.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f .zizmor-seeded-canary.yml
          if [ "$SEEDED_ZIZMOR_OUTCOME" != "failure" ]; then
            echo "::error::Seeded unsafe Actions pattern was not rejected by zizmor."
            exit 1
          fi
          echo "Seeded zizmor unsafe pattern was detected as required."

  renovate-config:
    name: Item 6 / Renovate config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0

      - name: Prove malformed Renovate configuration is rejected
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/renovate-invalid.json"
          printf '%s\n' '{"extends":["config:recommended"],"platformAutomerge":"definitely-not-a-boolean"}' > "$fixture"
          set +e
          npx --yes --package=renovate@44.133.0 renovate-config-validator --strict "$fixture"
          status=$?
          set -e
          rm -f "$fixture"
          if [ "$status" -eq 0 ]; then
            echo "::error::Malformed Renovate configuration unexpectedly passed strict validation."
            exit 1
          fi
          echo "Malformed Renovate configuration was rejected as required."

      - name: Validate Renovate configuration
        run: npx --yes --package=renovate@44.133.0 renovate-config-validator --strict renovate.json

# Artifact provenance/SBOM is intentionally N/A in this workflow. HIVE is
# deployed by Koyeb's git-driven build and GitHub Actions does not publish the
# immutable production artifact or digest Koyeb deploys. Attesting a generated
# repository SBOM would not prove provenance for the running service.
