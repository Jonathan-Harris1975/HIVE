name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
        - language: python
          build-mode: none
        - language: actions
          build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"

  enforce_open_alerts:
    name: CodeQL open-alert gate
    needs: analyze
    if: >-
      ${{
        always() &&
        needs.analyze.result == 'success' &&
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Fail when CodeQL still reports open alerts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            scope="pr=${PR_NUMBER}"
          else
            scope="ref=refs/heads/${REF_NAME}"
          fi

          # CodeQL result ingestion is normally complete when analyze returns,
          # but a short delay avoids racing the code-scanning API on busy runs.
          sleep 5
          response="$(curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/code-scanning/alerts?state=open&${scope}&per_page=100")"

          codeql_alerts="$(printf '%s' "$response" | jq '[.[] | select((.tool.name // "") == "CodeQL")]')"
          count="$(printf '%s' "$codeql_alerts" | jq 'length')"

          {
            echo "## CodeQL open-alert gate"
            echo
            echo "Open CodeQL alerts for this ref/PR: **${count}**"
            if [ "$count" -gt 0 ]; then
              echo
              printf '%s' "$codeql_alerts" | jq -r '.[] | "- #\(.number) **\(.rule.id // .rule.name // "unknown-rule")** at `\(.most_recent_instance.location.path // "unknown"):\(.most_recent_instance.location.start_line // 0)` — \(.html_url)"'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$count" -gt 0 ]; then
            echo "::error::CodeQL reported ${count} open alert(s). The autonomous repair workflow will hand the failure to Kilo."
            exit 1
          fi
