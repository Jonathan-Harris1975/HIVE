name: CodeQL configuration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  default-setup:
    name: CodeQL managed by GitHub default setup
    runs-on: ubuntu-latest
    steps:
      - name: Confirm CodeQL ownership
        run: |
          echo "CodeQL scanning for this repository is managed by GitHub default setup."
          echo "Do not add a second advanced CodeQL analysis workflow while default setup is enabled."
