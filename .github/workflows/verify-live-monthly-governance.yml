name: Verify live monthly governance
on:
  workflow_dispatch:
    inputs:
      period:
        description: "Review month (YYYY-MM); defaults to last completed month"
        required: false
        type: string
      execute:
        description: "Explicitly execute the live governance workflow (writes to downstream services)"
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      HIVE_BASE_URL: ${{ vars.HIVE_BASE_URL }}
      HIVE_ADMIN_TOKEN: ${{ secrets.HIVE_ADMIN_TOKEN }}
      PERIOD: ${{ inputs.period }}
      EXECUTE: ${{ inputs.execute }}
    steps:
      - name: Verify prerequisites and execute only when approved
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, sys, urllib.error, urllib.request
          base = os.getenv("HIVE_BASE_URL", "").strip().rstrip("/")
          token = os.getenv("HIVE_ADMIN_TOKEN", "")
          period = os.getenv("PERIOD", "").strip()
          if not base.startswith("https://") or not token:
              sys.exit("Missing production variable HIVE_BASE_URL or secret HIVE_ADMIN_TOKEN")
          if period and not re.fullmatch(r"20[0-9]{2}-(0[1-9]|1[0-2])", period):
              sys.exit("period must be YYYY-MM")
          if os.getenv("EXECUTE") != "true":
              sys.exit("Execution disabled: dispatch again with execute=true after approving production writes")
          endpoint = base + "/v1/monthly-review/generate" + (("?period=" + period) if period else "")
          request = urllib.request.Request(endpoint, method="POST", headers={
              "Authorization": "Bearer " + token, "Accept": "application/json"
          })
          try:
              with urllib.request.urlopen(request, timeout=480) as response:
                  data = json.load(response)
          except urllib.error.HTTPError as error:
              print("Governance endpoint HTTP failure:", error.code)
              try:
                  body = json.loads(error.read().decode("utf-8"))
                  detail = body.get("detail") if isinstance(body, dict) else None
                  report = detail.get("report") if isinstance(detail, dict) else None
                  if not isinstance(report, dict):
                      print("HTTP response did not contain a governance report")
                      sys.exit(1)
                  council = report.get("council_cycle") or {}
                  run = council.get("run") or {}
                  sync = run.get("downstream_sync") or {}
                  print("Report OK:", report.get("ok"))
                  print("Sections:", report.get("sections_ok"), "/", report.get("sections_total"))
                  for section_name, section in (report.get("sections") or {}).items():
                      if isinstance(section, dict) and section.get("ok") is False:
                          print("FAILED section:", section_name)
                  print("Council OK:", council.get("ok"))
                  print("Council failure stage:", council.get("failure_stage"))
                  print("Council qualified models:", council.get("qualified_model_count"))
                  council_run = council.get("run") or {}
                  print("Providers discovered:", council_run.get("providers_discovered"))
                  print("Models discovered:", council_run.get("models_seen"))
                  print("Models promoted:", len(council_run.get("promotions") or []))
                  print("Qualification counts:", council_run.get("qualification_counts"))
                  print("Benchmark matching:", council_run.get("benchmark_match_counts"))
                  for source in council_run.get("benchmark_sources") or []:
                      if isinstance(source, dict):
                          print("Benchmark source:", {k: source.get(k) for k in ("provider", "source", "status", "ok") if k in source})
                  print("Council cycle completion:", council.get("completion_status"))
                  print("Council downstream enabled:", (council.get("downstream_sync") or {}).get("enabled"))
                  print("Council downstream OK:", (council.get("downstream_sync") or {}).get("ok"))
                  print("Council reused:", council.get("reused"))
                  print("Council completion:", run.get("completion_status"))
                  print("Downstream enabled:", sync.get("enabled"))
                  print("Downstream OK:", sync.get("ok"))
                  print("R2 OK:", (report.get("r2_object") or {}).get("ok"))
                  print("D1 OK:", (report.get("d1_index") or {}).get("ok"))
              except (ValueError, TypeError, AttributeError):
                  print("HTTP response did not contain a parseable governance report")
              sys.exit(1)
          except Exception as error:
              print("Governance request failed:", type(error).__name__)
              sys.exit(1)
          council = data.get("council_cycle") or {}
          run = council.get("run") or {}
          sync = run.get("downstream_sync") or {}
          r2 = data.get("r2_object") or {}
          d1 = data.get("d1_index") or {}
          checks = {
              "report_ok": data.get("ok") is True,
              "sections_complete": data.get("sections_total", 0) > 0 and data.get("sections_ok") == data.get("sections_total"),
              "council_ok": council.get("ok") is True,
              "council_completed": run.get("completion_status") == "completed",
              "downstream_enabled": sync.get("enabled") is True,
              "downstream_ok": sync.get("ok") is True,
              "r2_archived": r2.get("ok") is True,
              "d1_indexed": d1.get("ok") is True,
          }
          for name, passed in checks.items():
              print(("PASS" if passed else "FAIL") + " " + name)
          if not all(checks.values()):
              sys.exit("Live governance verification failed")
          print("Live monthly governance checks passed")
          PY
