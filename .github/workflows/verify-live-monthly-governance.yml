name: Verify monthly operations reporting
on:
  workflow_dispatch:
    inputs:
      period:
        description: "Review month (YYYY-MM); defaults to last completed month"
        required: false
        type: string
      execute:
        description: "Explicitly execute the monthly report generation (writes report archives)"
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    env:
      HIVE_BASE_URL: ${{ vars.HIVE_BASE_URL }}
      HIVE_ADMIN_TOKEN: ${{ secrets.HIVE_ADMIN_TOKEN }}
      PERIOD: ${{ inputs.period }}
      EXECUTE: ${{ inputs.execute }}
    steps:
      - name: Start once and poll the D1-backed job
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, sys, time, urllib.error, urllib.request
          base = os.getenv("HIVE_BASE_URL", "").strip().rstrip("/")
          token = os.getenv("HIVE_ADMIN_TOKEN", "")
          period = os.getenv("PERIOD", "").strip()
          if not base.startswith("https://") or not token:
              sys.exit("Missing production variable HIVE_BASE_URL or secret HIVE_ADMIN_TOKEN")
          if period and not re.fullmatch(r"20[0-9]{2}-(0[1-9]|1[0-2])", period):
              sys.exit("period must be YYYY-MM")
          if os.getenv("EXECUTE") != "true":
              sys.exit("Execution disabled: dispatch again with execute=true after approving production writes")

          headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/json",
              "Content-Type": "application/json",
          }
          endpoint = base + "/v1/monthly-review/generate"
          if period:
              endpoint += "?period=" + period
          request = urllib.request.Request(endpoint, method="POST", headers=headers, data=b"{}")
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  accepted = json.load(response)
          except urllib.error.HTTPError as error:
              print("Governance start rejected with HTTP", error.code)
              print(error.read().decode("utf-8", errors="replace")[:2000])
              if error.code in (409, 502, 503, 504):
                  print("Do not retry automatically; inspect D1, R2, Council history and AIMS/RAMS effects first.")
              sys.exit(1)
          except Exception as error:
              print("Governance start request failed:", type(error).__name__)
              print("The request outcome may be ambiguous. Inspect the D1 job and report effects before retrying.")
              sys.exit(1)

          accepted_period = accepted.get("period")
          if not accepted.get("accepted") or not accepted_period:
              sys.exit("HIVE did not return an accepted period")
          print("Accepted period:", accepted_period)
          status_url = base + "/v1/monthly-review/jobs/" + accepted_period
          deadline = time.monotonic() + 85 * 60
          while time.monotonic() < deadline:
              status_request = urllib.request.Request(status_url, headers=headers)
              try:
                  with urllib.request.urlopen(status_request, timeout=60) as response:
                      job = json.load(response)
              except Exception as error:
                  sys.exit("Status lookup failed; do not start a second run: " + type(error).__name__)
              state = job.get("state") or {}
              current = state.get("status")
              print("Job status:", current)
              if current == "completed":
                  print("Monthly governance job completed.")
                  sys.exit(0)
              if current == "failed":
                  sys.exit("Monthly governance job failed; inspect report and report effects before retrying.")
              if current != "claimed":
                  sys.exit("Unexpected monthly governance status: " + str(current))
              time.sleep(15)
          sys.exit("Polling window expired with the job still claimed. Reconcile its status and report writes before retrying.")
          PY