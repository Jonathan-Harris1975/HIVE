name: autofix.ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  autofix:
    if: github.actor != 'autofix-ci[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
          cache: pip
      - name: Install repository-pinned formatting toolchain
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Apply safe Ruff fixes only
        run: python -m ruff check backend/app backend/tests scripts --fix-only --select E4,E7,E9,F
      - name: Submit autofix patch
        uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a
        with:
          fail-fast: false
