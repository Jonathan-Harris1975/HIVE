name: Worker D1 preflight (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    defaults:
      run:
        working-directory: backend
    env:
      D1_ENABLED: "true"
      D1_ACCOUNT_ID: ${{ secrets.D1_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      D1_API_KEY: ${{ secrets.D1_API_KEY }}
      CF_R2_ACCOUNT_ID: ${{ secrets.CF_R2_ACCOUNT_ID }}
      CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
      CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_AUDITS: ${{ vars.R2_BUCKET_AUDITS }}
      AIMS_BASE_URL: ${{ vars.AIMS_BASE_URL }}
      AIMS_API_KEY: ${{ secrets.AIMS_API_KEY }}
      RAMS_BASE_URL: ${{ vars.RAMS_BASE_URL }}
      RAMS_API_KEY: ${{ secrets.RAMS_API_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify worker settings and D1 schema (no governance writes)
        run: python -m app.monthly_governance_worker --previous-month --preflight-only
