name: Worker D1 preflight (read only)
on:
  push:
    branches: [main]
    paths:
      - "backend/app/core/governed_repositories.py"
      - "backend/app/storage/d1.py"
      - "scripts/preflight_recovery_d1.py"
      - ".github/workflows/preflight-governance-worker-d1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker-preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: Koyeb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve production service
        env:
          KOYEB_SERVICE_REPOSITORY: ${{ vars.KOYEB_SERVICE || '' }}
          KOYEB_SERVICE_SECRET: ${{ secrets.KOYEB_SERVICE || '' }}
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          service="${KOYEB_SERVICE_SECRET:-${KOYEB_SERVICE_REPOSITORY:-}}"
          test -n "$service" || { echo "::error::KOYEB_SERVICE is required."; exit 1; }
          test -n "${KOYEB_TOKEN:-}" || { echo "::error::KOYEB_TOKEN is required."; exit 1; }
          printf 'KOYEB_SERVICE=%s\n' "$service" >> "$GITHUB_ENV"
      - name: Install verified Koyeb CLI
        env:
          KOYEB_CLI_VERSION: "5.10.2"
        run: |
          set -euo pipefail
          archive="koyeb-cli_${KOYEB_CLI_VERSION}_linux_amd64.tar.gz"
          release_url="https://github.com/koyeb/koyeb-cli/releases/download/v${KOYEB_CLI_VERSION}"
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
            --output "$workdir/$archive" "$release_url/$archive"
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
            --output "$workdir/checksums.txt" "$release_url/checksums.txt"
          (
            cd "$workdir"
            grep -F "  $archive" checksums.txt > archive.sha256
            test -s archive.sha256
            sha256sum --check --strict archive.sha256
            tar -xzf "$archive"
          )
          install -d -m 0755 "$HOME/.local/bin"
          install -m 0755 "$workdir/koyeb" "$HOME/.local/bin/koyeb"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Require exact production revision
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          EXPECTED_DEPLOYMENT_SHA: ${{ github.sha }}
          SERVICE_DISPLAY_NAME: HIVE
        run: python scripts/watch_koyeb_deployment.py
      - name: Verify deployed worker settings and all recovery D1 schemas (read only)
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Run inside the production container; resident credentials stay there.
          # The preflight flag prevents governance jobs, reports and publishing.
          script -q -e -c 'koyeb services exec "$KOYEB_SERVICE" python -- -m app.monthly_governance_worker --previous-month --preflight-only' /dev/null < /dev/null
          output="$(script -q -e -c 'koyeb services exec "$KOYEB_SERVICE" python -- scripts/preflight_recovery_d1.py' /dev/null < /dev/null)"
          printf '%s\n' "$output"
          grep -F '"event":"recovery.d1.preflight","status":"verified"' <<< "$output" > /dev/null
