name: Repository Council

on:
  # Dispatch only: the weekend orchestrator releases the Council once Mergify has completed,
  # CI/CodeQL/Security and the exact-SHA deployment are green, and at least one hour after
  # the Renovate window has closed.
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact default-branch SHA to judge (blank = current default branch)"
        required: false
        type: string
      pending_minimum_age:
        description: "Renovate updates still waiting on minimumReleaseAge (from the dashboard)"
        required: false
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: repository-council
  cancel-in-progress: false

jobs:
  council:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out trusted Council definition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Resolve and validate target SHA
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUESTED_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          default_sha="$(gh api "repos/${REPO}/commits/${DEFAULT_BRANCH}" --jq '.sha')"
          target="${REQUESTED_SHA:-$default_sha}"
          resolved="$(gh api "repos/${REPO}/commits/${target}" --jq '.sha')"
          if [ "$resolved" != "$default_sha" ]; then
            echo "::error::Council only judges the current default-branch SHA. Requested/resolved ${resolved}; current ${default_sha}."
            exit 1
          fi
          printf 'sha=%s\n' "$resolved" >> "$GITHUB_OUTPUT"

      - name: Require current exact-SHA CI and security evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUIRED_WORKFLOWS: "CI|CodeQL|Security and repository quality"
        shell: bash
        run: |
          set -euo pipefail
          IFS='|' read -r -a required <<< "$REQUIRED_WORKFLOWS"
          for _ in $(seq 1 60); do
            runs="$(gh api --paginate --slurp "repos/${REPO}/actions/runs?head_sha=${TARGET_SHA}&per_page=100" --jq 'map(.workflow_runs) | add')"
            ready=true
            for workflow in "${required[@]}"; do
              result="$(jq -r --arg name "$workflow" --arg branch "$DEFAULT_BRANCH" --arg sha "$TARGET_SHA" \
                '[.[] | select(.name == $name and .head_branch == $branch and .head_sha == $sha and .event != "pull_request")] | sort_by(.run_number, .run_attempt) | last | if .status == "completed" then .conclusion else "pending" end' <<< "$runs")"
              case "$result" in
                success) ;;
                failure|cancelled|timed_out|action_required|skipped|neutral|stale)
                  echo "::error::Required workflow $workflow returned $result for $TARGET_SHA."
                  exit 1 ;;
                *) ready=false ;;
              esac
            done
            if [ "$ready" = true ]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Exact-SHA CI/security evidence did not become ready."
          exit 1

      - name: Refuse Council while autonomous repair is unresolved
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          blockers="$(gh pr list --repo "$REPO" --state open --limit 1000 \
            --json number,title,labels,url \
            --jq '[.[] | select(any(.labels[]?; .name == "autonomy:human-hold") or (any(.labels[]?; .name == "autonomy:repair") and (any(.labels[]?; .name == "autonomy:obsolete" or .name == "autonomy:superseded") | not)))]')"
          count="$(jq 'length' <<< "$blockers")"
          if [ "$count" -gt 0 ]; then
            echo "::error::Council cannot start with ${count} unresolved autonomy repair/human-hold PR(s)."
            jq -r '.[] | "#\(.number) \(.title) \(.url)"' <<< "$blockers"
            exit 1
          fi

      - name: Validate Kilo Council trigger
        env:
          KILO_REPAIR_TRIGGER_URL: ${{ secrets.KILO_REPAIR_TRIGGER_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KILO_REPAIR_TRIGGER_URL:-}" || { echo "::error::KILO_REPAIR_TRIGGER_URL is required."; exit 1; }
          python3 .github/scripts/kilo_webhook_url.py

      - name: Create bounded Council result channel
        id: result_channel
        env:
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || vars.CF_R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.CF_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.CF_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: hive-repositories
        shell: bash
        run: |
          set -euo pipefail
          repo_key="${REPO//\//__}"
          key="ci-evidence/${repo_key}/council-final/${TARGET_SHA}/${RUN_ID}-${RUN_ATTEMPT}.json"
          url="$(python3 .github/scripts/r2_result_channel.py presign-put --bucket "$R2_BUCKET" --key "$key" --expires 3600)"
          echo "::add-mask::$url"
          {
            echo "key=$key"
            echo "put_url=$url"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch repository Council to Kilo
        env:
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PENDING_MINIMUM_AGE: ${{ inputs.pending_minimum_age || 'unknown' }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          KILO_REPAIR_TRIGGER_URL: ${{ secrets.KILO_REPAIR_TRIGGER_URL }}
          COUNCIL_RESULT_PUT_URL: ${{ steps.result_channel.outputs.put_url }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$COUNCIL_RESULT_PUT_URL"
          prompt="$(cat .council/council.md)"
          prompt="${prompt}"
          test -n "${prompt//[[:space:]]/}" || { echo "::error::Council contract is empty."; exit 1; }
          task="$(cat <<EOF
          Run the repository Council defined below against exact SHA ${TARGET_SHA} in ${REPO}.
          The checked-in .council/council.md is the authoritative Council contract.
          Inspect live GitHub Actions, security, pull-request, merge, deployment and repository evidence tied to that SHA.
          Do not infer missing evidence and do not weaken checks.
          Renovate updates still waiting on minimumReleaseAge at this run: ${PENDING_MINIMUM_AGE}. Record them as PENDING_MINIMUM_AGE (not a failure).
          If a safe repository change is required, make the smallest justified change on one branch and open one PR against the default branch. Do not merge or deploy it yourself.
          If no code change is required, do not create a cosmetic PR.

          When the Council review is complete, write a sanitised JSON file named council-final.json containing:
          {"kind":"council-final","repository":"${REPO}","sha":"${TARGET_SHA}","run_id":${RUN_ID},"run_attempt":${RUN_ATTEMPT},"certification_complete":true,"disposition":"READY|HOLD|PENDING_MINIMUM_AGE","evidence":[],"blockers":[]}
          Populate evidence and blockers with concise non-secret strings. Do not include credentials, tokens, raw secret scanner output, or the upload URL in the JSON.
          Then upload that exact file with:
          curl --fail --silent --show-error --request PUT --header 'Content-Type: application/json' --data-binary @council-final.json '${COUNCIL_RESULT_PUT_URL}'
          The URL is a short-lived capability for this one Council result object only. Do not print, persist, echo, commit, or reuse it.
          The GitHub Council workflow will validate the exact repository/SHA/run binding before accepting the result.

          ${prompt}
          EOF
          )"
          payload="$(jq -n \
            --arg repository "$REPO" \
            --arg sha "$TARGET_SHA" \
            --arg run "$RUN_URL" \
            --arg task "$task" \
            '{repository:$repository,target_sha:$sha,council_run:$run,kind:"repository-council",task:$task}')"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 30 \
            --request POST --header 'Content-Type: application/json' --data "$payload" "$KILO_REPAIR_TRIGGER_URL")"
          if [[ "$status" != 2?? ]]; then
            echo "::error::Kilo Council trigger returned HTTP ${status}."
            exit 1
          fi
          echo "Council dispatched for ${REPO}@${TARGET_SHA}."

      - name: Wait for and validate final Council result
        env:
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RESULT_KEY: ${{ steps.result_channel.outputs.key }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || vars.CF_R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.CF_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.CF_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: hive-repositories
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/r2_result_channel.py wait-get \
            --bucket "$R2_BUCKET" \
            --key "$RESULT_KEY" \
            --output council-final.json \
            --timeout 2700 \
            --interval 15
          python3 .github/scripts/r2_result_channel.py validate-result council-final.json \
            --repository "$REPOSITORY" \
            --sha "$TARGET_SHA" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT"
          disposition="$(jq -r '.disposition' council-final.json)"
          echo "Final Council disposition: $disposition"

      - name: Build exact-run Council evidence receipt
        env:
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PENDING_MINIMUM_AGE: ${{ inputs.pending_minimum_age || 'unknown' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema_version": 1,
              "kind": "council",
              "repository": os.environ["REPOSITORY"],
              "sha": os.environ["TARGET_SHA"],
              "run_id": int(os.environ["RUN_ID"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "workflow": "Repository Council",
              "preflight_exact_sha_verified": True,
              "required_ci_security_verified": True,
              "unresolved_autonomy_state": False,
              "external_council_dispatch": "accepted",
              "certification_complete": True,
              "pending_minimum_release_age": os.environ.get("PENDING_MINIMUM_AGE", "unknown"),
              "note": "Final Council result was returned through the bounded exact-run R2 result channel and validated before this receipt was written.",
          }
          Path("council-r2-evidence.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Persist Council run evidence to hive-repositories R2
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || vars.CF_R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.CF_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.CF_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: hive-repositories
          R2_EVIDENCE_PREFIX: ci-evidence
        run: python3 .github/scripts/r2_evidence_store.py council-r2-evidence.json
