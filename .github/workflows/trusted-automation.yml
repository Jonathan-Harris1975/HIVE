name: Trusted automation admission for Mergify
permissions:
  actions: read
  checks: read
  contents: read
  security-events: read
  statuses: write
concurrency:
  group: trusted-automation-${{ github.repository }}
  cancel-in-progress: false
jobs:
  reconcile:
    concurrency:
      group: council-window-${{ github.repository }}-default
      cancel-in-progress: false
    if: |-
      ${{
        (github.event_name != 'issue_comment' ||
         (github.event.issue.pull_request &&
          (github.event.comment.user.type != 'Bot' ||
           github.event.comment.user.login == (vars.KILO_REPAIR_PR_LOGIN || 'kilo-code-bot[bot]')))) &&
        (github.event_name != 'workflow_run' || github.event.action != 'requested' ||
         github.event.workflow_run.event == 'pull_request')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
    - name: Mint autonomous repair GitHub App token
      id: app_token
      env:
        APP_ID: ${{ vars.AUTONOMY_REPAIR_APP_ID }}
        APP_PRIVATE_KEY: ${{ secrets.AUTONOMY_REPAIR_APP_PRIVATE_KEY }}
        REPO: ${{ github.repository }}
      shell: bash
      run: |
        set -euo pipefail
        test -n "${APP_ID:-}" || { echo "::error::Repository variable AUTONOMY_REPAIR_APP_ID is required."; exit 1; }
        test -n "${APP_PRIVATE_KEY:-}" || { echo "::error::Repository secret AUTONOMY_REPAIR_APP_PRIVATE_KEY is required."; exit 1; }

        key_file="${RUNNER_TEMP}/autonomy-repair-app.pem"
        printf '%s\n' "$APP_PRIVATE_KEY" > "$key_file"
        chmod 600 "$key_file"

        b64url() {
          openssl base64 -A | tr '+/' '-_' | tr -d '='
        }

        now="$(date +%s)"
        iat="$((now - 60))"
        exp="$((now + 540))"
        header="$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)"
        payload="$(printf '{"iat":%s,"exp":%s,"iss":"%s"}' "$iat" "$exp" "$APP_ID" | b64url)"
        unsigned="${header}.${payload}"
        signature="$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$key_file" -binary | b64url)"
        jwt="${unsigned}.${signature}"

        installation="$(
          curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${jwt}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/installation"
        )"
        installation_id="$(jq -er '.id' <<< "$installation")"
        repair_app_slug="$(jq -er '.app_slug' <<< "$installation")"

        app_token="$(
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${jwt}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/app/installations/${installation_id}/access_tokens" |
            jq -er '.token'
        )"

        rm -f "$key_file"
        echo "::add-mask::${app_token}"
        printf 'token=%s\n' "$app_token" >> "$GITHUB_OUTPUT"
        printf 'repair_app_login=%s[bot]\n' "$repair_app_slug" >> "$GITHUB_OUTPUT"
    - name: Check out trusted default-branch automation only
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.event.repository.default_branch }}
        persist-credentials: false
    - name: Create and reconcile trusted branch pull requests
      env:
        GH_TOKEN: ${{ steps.app_token.outputs.token }}
        REPO: ${{ github.repository }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        REPAIR_APP_LOGIN: ${{ steps.app_token.outputs.repair_app_login }}
        REQUIRED_WORKFLOWS: CI|CodeQL|Security and repository quality
        REQUIRED_CHECKS: ci-gate|CodeQL security alert gate|Trivy, Gitleaks and actionlint|Hadolint and ShellCheck|Autonomous repair marker gate|Analyze (actions)|Analyze (python)
      run: python .github/scripts/branch_pr_automation.py
    - name: Admit, repair and reconcile verified automation pull requests
      id: admission
      if: ${{ !cancelled() && steps.app_token.outcome == 'success' }}
      env:
        GH_TOKEN: ${{ steps.app_token.outputs.token }}
        READ_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        REPAIR_APP_LOGIN: ${{ steps.app_token.outputs.repair_app_login }}
        KILO_REPAIR_PR_LOGIN: ${{ vars.KILO_REPAIR_PR_LOGIN }}
        CURRENT_RUN_ID: ${{ github.run_id }}
        REQUIRED_WORKFLOWS: CI|CodeQL|Security and repository quality
        ADMISSION_STATUS_TOKEN: ${{ github.token }}
        DAST_ENABLED: ${{ vars.DAST_ENABLED }}
      run: python .github/scripts/trusted_automation.py
    - name: Retain authenticated current-envelope repair authorization
      if: steps.admission.outputs.repair_artifact != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.admission.outputs.repair_artifact }}
        path: .council-repair-authorizations/*.json
        if-no-files-found: error
        retention-days: 90
'on':
  issue_comment:
    types:
    - created
  pull_request_review:
    types:
    - submitted
    - edited
  pull_request_review_comment:
    types:
    - created
    - edited
  workflow_run:
    workflows:
    - CI
    - CodeQL
    - Security and repository quality
    - Branch PR signal
    types:
    - requested
    - completed
  schedule:
  - cron: 17,47 22-23 * * 6
  - cron: 17,47 0-5 * * 0
  - cron: 17 6 * * *
  - cron: 23 * * * *
  pull_request_target:
    types:
    - labeled
    - unlabeled
    - converted_to_draft
    - ready_for_review
    - synchronize
    - reopened
  workflow_dispatch: null
