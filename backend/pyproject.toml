[project]
name = "jh-ops-chat-backend"
version = "0.1.0"
description = "Standalone Python OpenRouter ops chatbot backend"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.141.1",
  "starlette>=1.6.0",
  "uvicorn[standard]>=0.50.2",
  "httpx>=0.28.1",
  "pydantic-settings>=2.14.2",
  "python-multipart>=0.0.32",
  "boto3>=1.43.41",
  "pypdf>=6.14.2",
  "python-docx>=1.2.0",
  "openpyxl>=3.1.5",
  "beautifulsoup4>=4.15.0",
  "headroom-ai==0.32.0",
  "psycopg[binary]>=3.3.4"
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4.0,<2",
  "pytest-cov>=7.1.0,<8",
  "ruff>=0.15.20,<1",
  "mypy>=2.1.0,<3",
  "pip-audit>=2.10.1,<3",
  "bandit>=1.9.4,<2",
  "pip-tools>=7.6.1,<8"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
